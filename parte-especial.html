      ["§8º-A","Por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia: +2/3. Não se soma à lesão seguida de morte do §3º-A, que já tem pena própria de 20 a 40 anos.",["M","nov","lei:15.358/2026"]],

   ],"",["nov"],"No caso, o único fato comprovado era a embriaguez, insuficiente por si só para o dolo. A fuga pode configurar o crime autônomo do art. 305 do CTB."],
  ["Embriaguez e contramão",[
    ["","Verifica-se a existência de dolo eventual no ato de dirigir veículo automotor sob a influência de álcool, além de fazê-lo na contramão.","STF. 1ª Turma. HC 124687/MS, rel. Min. Marco Aurélio, red. p/ o ac. Min. Roberto Barroso, julgado em 29/5/2018 (Info 904)"]
   ],"",[],""],
  ["Entrega de veículo a pessoa embriagada",[
    ["","Se houver incorreto enquadramento fático-jurídico na capitulação penal, que repercuta na competência do órgão jurisdicional, admite-se, excepcionalmente, a possibilidade de o magistrado, antes da pronúncia e submissão do réu ao júri popular, efetuar a desclassificação para outro tipo penal e encaminhar o feito ao órgão competente.","STF. 2ª Turma. HC 113598/PE, Rel. Min. Gilmar Mendes, julgado em 15/12/2015 (Info 812)"]
   ],"",[],"No caso, não havia homicídio doloso na conduta de quem entregou o carro a uma mulher embriagada, que morreu no acidente."],
  ["Racha e motivo fútil",[
    ["","Não incide a qualificadora de motivo fútil (art. 121, § 2°, II, do CP), na hipótese de homicídio supostamente praticado por agente que disputava \"racha\", quando o veículo por ele conduzido (em razão de choque com outro automóvel também participante do \"racha\") tenha atingido o veículo da vítima, terceiro estranho à disputa automobilística.","STJ. 6ª Turma. HC 307617-SP, Rel. Min. Nefi Cordeiro, Rel. para acórdão Min. Sebastião Reis Júnior, julgado em 19/4/2016 (Info 583)"]
   ],"",[],""],
  ["Motivo fútil e briga",[
    ["","Se o fato surgiu por conta de uma bobagem, mas depois ocorreu uma briga e, no contexto desta, houve o homicídio, tal circunstância pode vir a descaracterizar o motivo fútil.",""],
    ["","A discussão anterior entre vítima e autor do homicídio, por si só, não afasta a qualificadora do motivo fútil.","STJ. 5ª Turma. AgRg no REsp 1113364-PE, Rel. Min. Sebastião Reis Júnior, julgado em 06/08/2013 (Info 525)"]
   ],"",[],""],
  ["Meio cruel e reiteração de golpes",[
    ["","O juiz, na decisão de pronúncia, só pode fazer o decote (retirada) da qualificadora imputada se ela for manifestamente improcedente, ou seja, se estiver completamente destituída de amparo nos elementos cognitivos dos autos.",""],
    ["","O fato de o agente ter praticado o crime com reiteração de golpes na vítima, ao menos em princípio e para fins de pronúncia, é circunstância indiciária do \"meio cruel\", previsto no art. 121, § 2º, III, do CP.","STJ. 6ª Turma. REsp 1241987-PR, Rel. Min. Maria Thereza de Assis Moura, julgado em 6/2/2014 (Info 537)"]
   ],"",[],""],
  ["Culposo: morte instantânea e majorante do §4º",[
    ["","No homicídio culposo, a morte instantânea da vítima não afasta a causa de aumento de pena prevista no art. 121, § 4º, do CP, a não ser que o óbito seja evidente, isto é, perceptível por qualquer pessoa.","STJ. 5ª Turma. HC 269038-RS, Rel. Min. Felix Fischer, julgado em 2/12/2014 (Info 554)"]
   ],"",["fgv"],""],
  ["Culposo: médico e regra técnica",[
    ["","É possível a aplicação da causa de aumento de pena prevista no art. 121, § 4º, do CP no caso de homicídio culposo cometido por médico e decorrente do descumprimento de regra técnica no exercício da profissão. Nessa situação, não há que se falar em bis in idem.","STJ. 5ª Turma. HC 181847-MS, Rel. Min. Marco Aurélio Bellizze, Rel. para acórdão Min. Campos Marques (Desembargador convocado do TJ/PR), julgado em 4/4/2013 (Info 520)"]
   ],"",[],""],
  ["Tenra idade da vítima e pena-base",[
    ["","A tenra idade da vítima (menor de 18 anos de idade) é elemento concreto e transborda aqueles inerentes ao crime de homicídio, sendo apto, em regra, a justificar o agravamento da pena-base, mediante valoração negativa das consequências do crime, ressalvada, para evitar bis in idem, a hipótese em que isso já é utilizado em outra fase da dosimetria da pena.","STJ. 3ª Seção. AgRg no REsp 1851435-PA, Rel. Min. Sebastião Reis Júnior, julgado em 12/08/2020 (Info 679)"]
   ],"par",["fgv"],"Com a Lei 14.344/2022, a vítima menor de 14 anos passou a qualificar o homicídio (§2º, IX). Se a idade for usada como qualificadora, não pode ser usada de novo como circunstância judicial negativa na 1ª fase."],
  ["Remoção ilegal de órgãos com resultado morte",[
    ["","É do juízo criminal singular a competência para julgar o crime de remoção ilegal de órgãos, praticado em pessoa viva e que resulte morte, previsto no art. 14, § 4º, da Lei nº 9.434/97 (Lei de Transplantes).","STF. 1ª Turma. RE 1313494/MG, Rel. Min. Dias Toffoli, julgado em 14/9/2021 (Info 1030)"]
   ],"",["fgv"],"No caso, o crime não foi homicídio qualificado, porque a finalidade era a remoção dos órgãos."]
 ],
 feminicidio:[
  ["Motivo torpe e feminicídio",[
    ["","Não caracteriza bis in idem o reconhecimento das qualificadoras de motivo torpe e de feminicídio no crime de homicídio praticado contra mulher em situação de violência doméstica e familiar.","STJ. 6ª Turma. HC 433898-RS, Rel. Min. Nefi Cordeiro, julgado em 24/04/2018 (Info 625); STJ. 5ª Turma. REsp 1739704/RS, Rel. Min. Jorge Mussi, julgado em 18/09/2018"]
   ],"sup",["fgv"],"Julgado anterior à Lei 14.994/2024, que revogou o inciso VI do §2º do art. 121 e transformou o feminicídio em crime autônomo (art. 121-A). Não há mais qualificadora de feminicídio a ser cumulada com o motivo torpe."]
 ],
 aborto:[
  ["Médico que comunica o aborto à polícia",[
    ["","A comunicação feita pela médica à polícia, sem consentimento da paciente e fora de hipótese legal de exceção, violou o dever de sigilo previsto no art. 207 do CPP, no Código de Ética Médica (Resolução CFM nº 2.217/2018) e na orientação firmada pela Consulta nº 24.292/00 do CREMESP. A prova originária assim produzida é ilícita.",""],
    ["","A tese da fonte independente (art. 157, § 2º, do CPP) não se aplica. A descoberta da localização do feto não decorreu de curso investigativo autônomo, mas exclusivamente da informação prestada pela médica.","STJ. 6ª Turma. HC 1.000.918-SP, Rel. Min. Otávio de Almeida Toledo (Desembargador convocado do TJSP), julgado em 15/4/2026 (Info 887)"]
   ],"",["nov","fgv"],"Resultado: provas derivadas contaminadas (art. 157, §1º, CPP), falta de justa causa e impronúncia."],
  ["Síndrome de Edwards",[
    ["","Não é possível a concessão de salvo-conduto autorizando a realização de procedimento de interrupção da gravidez, em aplicação, por analogia, do entendimento firmado no julgamento da ADPF n. 54/STF, quando, embora o feto esteja acometido de condição genética com prognóstico grave (Síndrome de Edwards e cardiopatia grave), com alta probabilidade de letalidade, não for possível extrair da documentação médica a impossibilidade de vida fora do útero.","STJ. 5ª Turma. HC 932.495-SC, Rel. Min. Messod Azulay Neto, julgado em 6/8/2024 (Info 820)"]
   ],"",["nov","fgv"],""],
  ["Interrupção no primeiro trimestre",[
    ["","A interrupção da gravidez no primeiro trimestre da gestação provocada pela própria gestante (art. 124) ou com o seu consentimento (art. 126) não é crime.","STF. 1ª Turma. HC 124306/RJ, rel. orig. Min. Marco Aurélio, red. p/ o ac. Min. Roberto Barroso, julgado em 29/11/2016 (Info 849)"]
   ],"",["fgv"],"Decisão de Turma em habeas corpus, sem efeito vinculante."]
 ],
 lesao:[
  ["Perda de dois dentes",[
    ["","A lesão corporal que provoca na vítima a perda de dois dentes tem natureza grave (art. 129, § 1º, III, do CP), e não gravíssima (art. 129, § 2º, IV, do CP).","STJ. 6ª Turma. REsp 1620158-RJ, Rel. Min. Rogerio Schietti Cruz, julgado em 13/9/2016 (Info 590)"]
   ],"",["fgv"],""],
  ["Concausa preexistente",[

   ],"",["fgv"],""],
  ["Deformidade permanente",[
    ["","A qualificadora prevista no art. 129, § 2º, IV, do Código Penal (deformidade permanente) abrange somente lesões corporais que resultam em danos físicos.","STJ. 6ª Turma. HC 689921-SP, Rel. Min. Laurita Vaz, julgado em 08/03/2022 (Info 728)"]

  ["Deformidade permanente e cirurgia reparadora",[
    ["","A qualificadora \"deformidade permanente\" do crime de lesão corporal (art. 129, § 2º, IV, do CP) não é afastada por posterior cirurgia estética reparadora que elimine ou minimize a deformidade na vítima.","STJ. 6ª Turma. HC 306677-RJ, Rel. Min. Ericson Maranho (Desembargador convocado do TJ-SP), Rel. para acórdão Min. Nefi Cordeiro, julgado em 19/5/2015 (Info 562)"]
   ],"",["fgv"],""],
  ["Violência doméstica contra irmão",[
    ["","Lesão corporal contra irmão configura o § 9º do art. 129 do CP não importando onde a agressão tenha ocorrido.","STJ. 5ª Turma. RHC 50026-PA, Rel. Min. Reynaldo Soares da Fonseca, julgado em 3/8/2017 (Info 609)"]
   ],"",[],""],
  ["Prova da lesão grave sem laudo",[
    ["","A ausência do laudo pericial não impede que a materialidade do delito de lesão corporal de natureza grave seja reconhecida por outros meios, como testemunhas e relatórios de atendimento hospitalar.","STF. 2ª Turma. HC 114567/ES, Rel. Min. Gilmar Mendes, julgado em 16/10/2012 (Info 684)"]
   ],"",[],""],
  ["Decisão médica no parto",[
    ["","A decisão médica em contexto de urgência, como a do parto, deve ser respeitada, dentro dos limites da responsabilidade civil, especialmente quando o procedimento adotado se revelar necessário para a segurança da parturiente e do recém-nascido.","STJ. 5ª Turma. AREsp 2.587.582-SP, Rel. Min. Ribeiro Dantas, Rel. para acórdão Min. Joel Ilan Paciornik, julgado em 27/8/2024 (Info 24, Edição Extraordinária)"]

  ["Vídeo editado",[
    ["","Configura difamação a conduta do agente que publica vídeo de um discurso no qual a frase completa do orador é editada, transmitindo a falsa ideia de que ele estava falando mal de negros e pobres.",""],

JURIS.injuria = [
  ["Pena da injúria qualificada",[
    ["","A pena prevista para o crime de injúria qualificada (art. 140, § 3º do CP) NÃO é desproporcional, sendo compatível com a CF/88, considerando que tem por objetivo proteger a dignidade da pessoa humana.","STF. 1ª Turma. HC 109676/RJ, rel. Min. Luiz Fux, julgado em 11/6/2013 (Info 710)"]
   ],"",[],""],
  ["Injúria racial: dano moral presumido",[
    ["Tese 1","A injúria racial gera dano moral presumido, na modalidade in re ipsa, por atingir a honra, a dignidade, a igualdade e a identidade da vítima.",""],
    ["Tese 2","A fixação de valor mínimo de reparação por dano moral decorrente de injúria racial dispensa instrução probatória específica sobre o abalo extrapatrimonial quando há pedido expresso e indicação do valor pretendido na denúncia.",""],
    ["Tese 3","O pedido expresso de reparação mínima formulado na denúncia, com indicação do montante pretendido, assegura o contraditório e a ampla defesa.","STJ. 5ª Turma. REsp 2.251.248-MG, Rel. Min. Ribeiro Dantas, julgado em 18/8/2026 (Info 898)"]
   ],"",["nov","fgv"],""],
  ["Lei 14.532/2023 e injúria racial anterior",[
    ["","O deslocamento da injúria racial do art. 140, § 3º, do CP para o art. 2º-A da Lei nº 7.716/1989, promovido pela Lei nº 14.532/2023, configura continuidade normativo-típica, não havendo abolitio criminis: todos os elementos típicos foram mantidos, com agravamento de pena.",""],
    ["","Diante da continuidade normativo-típica, a lei nova mais gravosa não retroage. Aplica-se integralmente aos fatos anteriores a redação do art. 140, § 3º, do CP vigente à época, por ser mais benéfica (ultratividade da lei penal).",""],
    ["","Também não é possível aproveitar apenas o que cada lei tem de mais favorável.","STJ. 6ª Turma. REsp 2.135.321-SP, Rel. Min. Carlos Pires Brandão, julgado em 22/4/2026 (Info 895)"]
   ],"",["nov","fgv"],""],
  ["Injúria racial é imprescritível",[
    ["","O crime de injúria racial, espécie do gênero racismo, é imprescritível.","STF. Plenário. HC 154248/DF, Rel. Min. Edson Fachin, julgado em 28/10/2021 (Info 1036); STJ. AgRg no REsp 1849696/SP, Rel. Min. Sebastião Reis Júnior, julgado em 16/06/2020"]
   ],"",["fgv"],"Depois da Lei 14.532/2023, a injúria racial está no art. 2º-A da Lei 7.716/89 (reclusão de 2 a 5 anos, e multa; aumento de metade se em concurso de duas ou mais pessoas)."],
  ["Injúria pela internet em mensagem privada: local da consumação",[
    ["","O crime de injúria praticado pela internet por mensagens privadas, as quais somente o autor e o destinatário têm acesso ao seu conteúdo, consuma-se no local em que a vítima tomou conhecimento do conteúdo ofensivo.","STJ. 3ª Seção. CC 184269-PB, Rel. Min. Laurita Vaz, julgado em 09/02/2022 (Info 724)"]
   ],"",["fgv"],"Se a publicação é visível a terceiros, o local é aquele em que o conteúdo foi incluído na internet."],
  ["Ofensa ouvida por acaso",[
    ["","A ausência de previsibilidade de que a ofensa chegue ao conhecimento da vítima afasta o dolo específico do delito de injúria, tornando a conduta atípica.","STJ. 6ª Turma. REsp 1765673-SP, Rel. Min. Sebastião Reis Júnior, julgado em 26/05/2020 (Info 672)"]
   ],"",["fgv"],"No caso, a vítima ouviu pela extensão telefônica uma conversa entre terceiros."],
  ["Esposa ofendida por insinuação sobre o marido",[
    ["","A esposa tem legitimidade para propor queixa-crime contra autor de mensagem que insinua que o seu marido tem uma relação extraconjugal com outro homem.","STF. 1ª Turma. Pet 7417 AgR/DF, Rel. Min. Luiz Fux, red. p/ o ac. Min. Marco Aurélio, julgado em 9/10/2018 (Info 919)"]
   ],"",[],""],
  ["Retorsão imediata",[
    ["","Não deve ser punido Deputado Federal que profere palavras injuriosas contra adversário político que também o ofendeu imediatamente antes.","STF. 1ª Turma. AP 926/AC, Rel. Min. Rosa Weber, julgado em 6/9/2016 (Info 838)"]
   ],"",["fgv"],"O fato foi considerado típico, ilícito e culpável, mas sem pena, com base no art. 140, §1º, II."],
  ["\"Não merece ser estuprada\"",[

   ],"",[],""]

  ["Crítica à gestão pública",[

  ["Crítica jornalística",[

JURIS["violencia-psicologica"] = [
  ["Dano emocional, não dano psíquico",[
    ["","A violência psicológica contra a mulher (art. 147-B do CP) não exige dano psíquico, apenas dano emocional, que pode ser comprovado por qualquer meio, dispensando prova técnica.","STJ. Corte Especial. Inq 1.802-DF, Rel. Min. Maria Thereza de Assis Moura, julgado em 20/5/2026 (Info 893)"]
   ],"",["nov","fgv"],"O dano psíquico configura lesão corporal (art. 129) e exige prova técnica. O mesmo julgado firmou teses sobre assédio sexual, que entram no art. 216-A."],
  ["Exame de corpo de delito dispensável",[
    ["","No crime de violência psicológica contra a mulher (art. 147-B do CP), o exame de corpo de delito pode ser dispensado quando há outras provas idôneas que demonstrem a materialidade delitiva.","STJ. 5ª Turma. AREsp 3.057.385-DF, Rel. Min. Joel Ilan Paciornik, julgado em 3/2/2026 (Info 887)"]
   ],"",["nov"],"No caso, a palavra da vítima foi corroborada por testemunha e mensagens de áudio (corpo de delito indireto)."]
];
JURIS.escravo = [
  ["Condições degradantes bastam",[
    ["","A configuração do delito de redução à condição análoga à de escravo, previsto no art. 149 do Código Penal, não exige a restrição da liberdade de locomoção dos trabalhadores, sendo suficiente a submissão a condições degradantes de trabalho.","STJ. 6ª Turma. REsp 2.204.503-BA, Rel. Min. Sebastião Reis Júnior, julgado em 9/9/2025 (Info 862)"],
    ["","O crime de redução a condição análoga à de escravo pode ocorrer independentemente da restrição à liberdade de locomoção do trabalhador, uma vez que esta é apenas uma das formas de cometimento do delito, mas não é a única.","STJ. 5ª Turma. REsp 1.969.868-MT, Rel. Min. Messod Azulay Neto, julgado em 12/9/2023 (Info 787)"],
    ["","Para configurar o delito do art. 149 do Código Penal (redução a condição análoga à de escravo) NÃO É imprescindível a restrição à liberdade de locomoção dos trabalhadores.","STJ. 3ª Seção. CC 127937-GO, Rel. Min. Nefi Cordeiro, julgado em 28/5/2014 (Info 543)"]
   ],"",["fgv","nov"],""]
];

   ],"",["fgv"],""]

JURIS.furto = [
  ["Consumação: teoria da amotio",[
    ["Tema 934","Consuma-se o crime de furto com a posse de fato da res furtiva, ainda que por breve espaço de tempo e seguida de perseguição ao agente, sendo prescindível a posse mansa e pacífica ou desvigiada.","STJ. 3ª Seção. REsp 1.524.450-RJ, Rel. Min. Nefi Cordeiro, julgado em 14/10/2015 (Recurso Repetitivo - Tema 934) (Info 572)"]
   ],"",["fgv"],""],
  ["Detido ainda dentro do estabelecimento",[
    ["","O fato de o agente ter sido surpreendido no interior do estabelecimento da vítima, portando consigo, acondicionados numa mochila, os bens que objetivava subtrair, demonstra tão somente o iter criminis percorrido, mas não a efetiva inversão da posse, configurando tentativa de furto.",""],
    ["","A adoção da teoria da apprehensio ou amotio pressupõe, para fins de consumação do delito de furto (ou roubo), que o agente tenha percorrido todas as etapas do iter criminis e cessado a clandestinidade, ainda que por brevíssimo lapso temporal que permita a retomada do bem, o que não ocorreu na espécie, haja vista que os bens que o agente objetivava subtrair sequer saíram do estabelecimento vítima.","STJ. 5ª Turma. AgRg no AgRg no AREsp 3.063.890-MS, Rel. Min. Reynaldo Soares da Fonseca, julgado em 3/3/2026 (Info 886)"]
   ],"",["nov","fgv"],"Caso: o agente guardou os bens na mochila e nos bolsos, mas foi detido pelo vigilante ainda dentro do terreno do escritório."],
  ["Sistema de vigilância",[
    ["Súmula 567-STJ","Sistema de vigilância realizado por monitoramento eletrônico ou por existência de segurança no interior de estabelecimento comercial, por si só, não torna impossível a configuração do crime de furto.",""],
    ["STF","A existência de sistema de vigilância em estabelecimento comercial não constitui óbice para a tipificação do crime de furto.","STF. 1ª Turma. HC 111278/MG, Rel. orig. Min. Marco Aurélio, red. p/ o ac. Min. Luiz Roberto Barroso, julgado em 10/4/2018 (Info 897); STF. 1ª Turma. HC 183.570, Rel. Min. Marco Aurélio, julgado em 10/11/2020"]
   ],"",["fgv"],"Não é crime impossível."],
  ["Repouso noturno: requisitos",[
    ["Tema 1144","1. Nos termos do § 1º do art. 155 do Código Penal, se o crime de furto é praticado durante o repouso noturno, a pena será aumentada de um terço. 2. O repouso noturno compreende o período em que a população se recolhe para descansar, devendo o julgador atentar-se às características do caso concreto. 3. A situação de repouso está configurada quando presente a condição de sossego/tranquilidade do período da noite, caso em que, em razão da diminuição ou precariedade de vigilância dos bens, ou, ainda, da menor capacidade de resistência da vítima, facilita-se a concretização do crime. 4. São irrelevantes os fatos das vítimas estarem, ou não, dormindo no momento do crime, ou o local de sua ocorrência, em estabelecimento comercial, via pública, residência desabitada ou em veículos, bastando que o furto ocorra, obrigatoriamente, à noite e em situação de repouso.","STJ. 3ª Seção. REsp 1979989-RS, Rel. Min. Joel Ilan Paciornik, julgado em 22/06/2022 (Recurso Repetitivo - Tema 1144) (Info 742)"]
   ],"par",["fgv"],"Atenção: a fração do item 1 mudou. Desde a Lei 15.397/2026 (em vigor em 4/5/2026), o §1º aumenta a pena de <b>metade</b>. Os itens 2 a 4 continuam valendo."],
  ["Repouso noturno no furto qualificado",[
    ["STJ: NÃO","A causa de aumento prevista no § 1º do art. 155 do Código Penal (prática do crime de furto no período noturno) não incide no crime de furto na sua forma qualificada (§ 4º).","STJ. 3ª Seção. REsp 1.890.981-SP, Rel. Min. João Otávio de Noronha, julgado em 25/05/2022 (Recurso Repetitivo - Tema 1087) (Info 738)"],
    ["STF: SIM","A causa de aumento do repouso noturno se coaduna com o furto qualificado quando compatível com a situação fática.","STF. 1ª Turma. HC 180966 AgR, Rel. Min. Luiz Fux, julgado em 04/05/2020"]
   ],"div",["fgv"],"O Tema 1087 mudou o entendimento anterior do próprio STJ, que admitia a incidência. Em prova objetiva, a FGV costuma cobrar o repetitivo do STJ."],
  ["Rompimento de obstáculo sem laudo",[
    ["Regra","Em regra, as qualificadoras da destruição ou rompimento de obstáculo e da escalada só podem ser aplicadas ao crime de furto mediante realização de exame pericial, porque o rompimento de obstáculo é circunstância que deixa vestígio e o art. 158 do CPP torna indispensável o exame de corpo de delito nessas infrações.",""],
    ["Exceção","A jurisprudência criou outra exceção. O STJ admite a manutenção da qualificadora sem laudo quando outras provas demonstrarem cabalmente a circunstância, como os depoimentos da vítima e de testemunhas, as fotografias do local, as filmagens de câmeras, a confissão e os materiais apreendidos compatíveis com o arrombamento.","STJ. 6ª Turma. REsp 2.204.445-SC, Rel. Min. Sebastião Reis Júnior, julgado em 3/6/2026 (Info 897)"]
   ],"",["nov","fgv"],"No caso, bastaram o relato da vítima nas duas fases e as fotografias da porta danificada, mesmo sem notícia de que os vestígios tivessem desaparecido."],
  ["Arrombamento é ato executório",[
    ["","Excepcionalmente, a materialidade das qualificadoras dos incisos I e II do § 4º do art. 155 do CP pode ser demonstrada por outros meios, desde que aptos a evidenciar a conduta de forma inconteste. Exs: testemunhas, fotografias, filmagens, confissão e materiais apreendidos compatíveis com o arrombamento.",""],
    ["","O arrombamento do cadeado e da porta de estabelecimento comercial, em plena madrugada, com ferramentas próprias para a empreitada, configura ato executório do furto, e não mero ato preparatório.",""],
    ["Em suma","A conduta do agente que inicia o rompimento de obstáculo, e não alcança a subtração de bens por razões alheias à sua vontade, não pode ser considerada mero ato preparatório do delito, mas tentativa de furto qualificado.","STJ. 5ª Turma. AgRg no REsp 2.255.737-MG, Rel. Min. Reynaldo Soares da Fonseca, julgado em 7/4/2026 (Info 887)"]
   ],"",["nov","fgv"],"Compare com o roubo (Info 711): romper cadeado da casa para depois roubar com arma é ato preparatório do roubo. No furto qualificado, o rompimento integra o tipo; no roubo, não."],
  ["Escalada e perícia",[
    ["Regra e exceção","O STJ firmou orientação de ser imprescindível, nos termos dos arts. 158 e 167 do CPP, a realização de exame pericial para o reconhecimento das qualificadoras de escalada e arrombamento no caso do delito de furto (art. 155, § 4º, II, do CP), quando os vestígios não tiverem desaparecido e puderem ser constatados pelos peritos. Contudo, excepcionalmente, pode-se dispensar a prova pericial quando estiverem presentes nos autos elementos aptos a comprovar a escalada de forma inconteste.","STJ. 6ª Turma. AgRg no REsp 1895487-DF, Rel. Min. Antonio Saldanha Palheiro, julgado em 26/04/2022 (Info 735)"],
    ["Policiais testemunharam","É desnecessária perícia técnica para configurar a qualificadora referente à escalada em furto cujo iter criminis foi testemunhado pelos policiais.","STJ. 6ª Turma. AgRg no AREsp 2.703.772-DF, Rel. Min. Rogerio Schietti Cruz, julgado em 18/2/2025 (Info 843)"]
   ],"",["nov","fgv"],"Info 843: o agente foi flagrado cortando fios no alto de um poste. Hoje, furto de fios e cabos tem forma própria (§8º, 2 a 8 anos)."],
  ["Chave falsa sem perícia",[
    ["","O exame pericial torna-se excepcionalmente prescindível à comprovação da qualificadora prevista no inciso III, do § 4º, do art. 155 do CP, quando inexistirem vestígios no veículo furtado e houver a apreensão de chave falsa em poder do agente.","STJ. 6ª Turma. AgRg no HC 876.671-SC, Rel. Min. Antonio Saldanha Palheiro, julgado em 29/4/2024 (Info 21, Edição Extraordinária)"]
   ],"",["nov"],""],
  ["Quebra de vidro do carro",[
    ["","A conduta de violar o automóvel, mediante a destruição do vidro para que seja subtraído bem que se encontre em seu interior, no caso, um aparelho de som automotivo, configura o tipo penal de furto qualificado pelo rompimento de obstáculo à subtração da coisa, previsto no art. 155, § 4º, inciso I, do CP.","STJ. 5ª Turma. AgRg no REsp 1364606-DF, Rel. Min. Jorge Mussi, julgado em 22/10/2013 (Info 532); STJ. 3ª Seção. EREsp 1079847/SP, Rel. Min. Jorge Mussi, julgado em 22/05/2013"]
   ],"",["fgv"],""],
  ["Destreza",[
    ["","No crime de furto, não deve ser reconhecida a qualificadora da “destreza” (art. 155, § 4º, II, do CP) caso inexista comprovação de que o agente tenha se valido de excepcional, incomum, habilidade para subtrair a coisa que se encontrava na posse da vítima sem despertar-lhe a atenção.","STJ. 5ª Turma. REsp 1478648-PR, Rel. para acórdão Min. Newton Trisotto (desembargador convocado do TJ/SC), julgado em 16/12/2014 (Info 554)"]
   ],"",["fgv"],"Destreza é a habilidade do punguista: subtrai bem em poder direto da vítima sem que ela perceba. Se a vítima percebe, não há destreza."],
  ["Explosivo antes da Lei 13.654/2018",[
    ["","Não é possível a aplicação do critério da consunção na hipótese de crime de furto praticado com emprego de explosivo em data anterior à vigência da Lei nº 13.654/2018, sendo legal, contudo, a aplicação retroativa do § 4º-A do art. 155 do Código Penal, pois constitui tipo de dupla objetividade jurídica, tutelando a incolumidade pública e o patrimônio.","STJ. 5ª Turma. HC 961.560-SP, Rel. Min. Messod Azulay Neto, julgado em 9/4/2025 (Info 856)"]
   ],"",["nov","fgv"],"O §4º-A retroage porque a pena dele é menor que a soma de furto qualificado com explosão majorada (art. 251, §2º)."],
  ["Furto de energia: pagamento",[
    ["","No caso de furto de energia elétrica mediante fraude, o adimplemento do débito antes do recebimento da denúncia não extingue a punibilidade.","STJ. 3ª Seção. RHC 101299-RS, Rel. Min. Nefi Cordeiro, Rel. Acd. Min. Joel Ilan Paciornik, julgado em 13/03/2019 (Info 645)"]
   ],"",["fgv"],"O pagamento gera só arrependimento posterior (art. 16). Tarifa não é tributo, então não se aplica a regra dos crimes tributários."],
  ["Furto de cheque",[
    ["","O talão de cheque e a folha avulsa de cheque (ainda que em branco) podem funcionar como objeto material de furto, pois possuem valor econômico, aferível pela provável utilização das cártulas como meio fraudulento para a obtenção de vantagem ilícita por parte de seus detentores.","STJ. 3ª Seção. CC 112.108/SP, Rel. Min. Marco Aurélio Bellizze, Rel. p/ Acórdão Min. Rogerio Schietti Cruz, julgado em 12/02/2014; STJ. 5ª Turma. AgRg no HC 410.154/RS, Rel. Min. Jorge Mussi, julgado em 03/10/2017 (Info 562)"]
   ],"",[],""],
  ["Insignificância e filho menor",[
    ["","Não se aplica o princípio da insignificância ao furto de bem de inexpressivo valor pecuniário de associação sem fins lucrativos com o induzimento de filho menor a participar do ato.","STJ. 6ª Turma. RHC 93472-MS, Rel. Min. Maria Thereza de Assis Moura, julgado em 15/03/2018 (Info 622)"]
   ],"",["fgv"],"Caso do cofrinho com R$ 4,80 de instituição de combate ao câncer, com filho de 9 anos."],
  ["Transportadora de valores e pena-base",[
    ["","No crime de furto contra empresa de segurança e transporte de valores, o prejuízo está inserido no risco do negócio e não autoriza a exasperação da pena basilar, porquanto ínsito ao tipo penal.","STJ. 5ª Turma. AgRg no AREsp 2.322.175-MG, Rel. Min. Reynaldo Soares da Fonseca, julgado em 30/5/2023 (Info 777)"]
   ],"",[],"Lembre do art. 183-A (Lei 14.967/2024): contra instituições financeiras e prestadores de segurança privada, a pena aumenta de 1/3 até o dobro."],
  ["Funcionário do banco e cartão da idosa",[
    ["","Se o funcionário do banco recebe o cartão e a senha da idosa para auxiliá-la a sacar um dinheiro do caixa eletrônico e, aproveitando a oportunidade, transfere quantias para a sua conta pessoal, tal conduta configura o crime previsto no art. 102 do Estatuto do Idoso.","STJ. 6ª Turma. REsp 1358865-RS, Rel. Min. Sebastião Reis Júnior, julgado em 4/9/2014 (Info 547)"]
   ],"",["fgv"],"Princípio da especialidade: sai do furto mediante fraude e vai para a lei especial."]
];
JURIS.roubo = [
  ["Consumação",[
    ["Súmula 582-STJ","Consuma-se o crime de roubo com a inversão da posse do bem mediante emprego de violência ou grave ameaça, ainda que por breve tempo e em seguida à perseguição imediata ao agente e recuperação da coisa roubada, sendo prescindível a posse mansa e pacífica ou desvigiada.","STJ. 3ª Seção. Aprovada em 14/09/2016, DJe 19/09/2016 (Info 590); REsp 1499050-RJ, Rel. Min. Rogerio Schietti Cruz, julgado em 14/10/2015 (Recurso Repetitivo - Tema 916) (Info 572)"]
   ],"",["fgv"],""],
  ["Roubo impróprio: “logo depois”",[
    ["","A violência empregada após a subtração da coisa, com o objetivo de assegurar a impunidade do crime, caracteriza o delito de roubo impróprio, nos termos do art. 157, §1º, do Código Penal.",""],
    ["","A expressão “logo depois” no art. 157, §1º, do Código Penal admite algum lapso temporal entre a subtração e a violência, desde que esta vise garantir a posse do bem ou a impunidade do delito.","STJ. 5ª Turma. AgRg no REsp 2.098.118-MG, Rel. Min. Messod Azulay Neto, julgado em 29/10/2025 (Info 873)"]
   ],"",["nov","fgv"],"Caso: a vítima alcançou o autor alguns quarteirões adiante e levou um soco. Roubo impróprio, e não furto mais lesão."],
  ["Atos preparatórios",[
    ["","Adotando-se a teoria objetivo-formal, o rompimento de cadeado e destruição de fechadura da porta da casa da vítima, com o intuito de, mediante uso de arma de fogo, efetuar subtração patrimonial da residência, configuram meros atos preparatórios que impedem a condenação por tentativa de roubo circunstanciado.","STJ. 5ª Turma. AREsp 974254-TO, Rel. Min. Ribeiro Dantas, julgado em 21/09/2021 (Info 711)"]
   ],"",["fgv"],"Compare com o furto qualificado (Info 887), em que o arrombamento já é ato executório."],
  ["Concurso formal: vítimas da mesma família",[
    ["Tema 1192","O cometimento de crimes de roubo mediante uma única conduta e sem desígnios autônomos contra o patrimônio de diferentes vítimas, ainda que da mesma família, configura concurso formal de crimes (art. 70 do Código Penal).","STJ. 3ª Seção. REsp 1.960.300-GO, Rel. Min. Og Fernandes, julgado em 8/10/2025 (Recurso Repetitivo - Tema 1192) (Info 868)"]
   ],"",["nov","fgv"],"É desnecessário individualizar qual bem pertence a cada vítima."],
  ["Um patrimônio, várias pessoas ameaçadas",[
    ["","No delito de roubo, se a intenção do agente é direcionada à subtração de um único patrimônio, estará configurado apenas um crime, ainda que, no modus operandi (modo de execução), seja utilizada violência ou grave ameaça contra mais de uma pessoa para a obtenção do resultado pretendido.","STJ. 6ª Turma. AgRg no REsp 1490894-DF, Rel. Min. Sebastião Reis Júnior, julgado em 10/2/2015 (Info 556)"]
   ],"",["fgv"],"O exemplo original fala em art. 157, §2º, I (redação antiga). Hoje, arma de fogo é §2º-A, I."],
  ["Ônibus: bens sob a posse do cobrador",[
    ["","Em caso de roubo praticado no interior de ônibus, o fato de a conduta ter ocasionado violação de patrimônios distintos (o da empresa de transporte coletivo e o do cobrador) não descaracteriza a ocorrência de crime único se todos os bens subtraídos estavam na posse do cobrador.","STJ. 5ª Turma. AgRg no REsp 1396144-DF, Rel. Min. Walter de Almeida Guilherme (Desembargador Convocado do TJ/SP), julgado em 23/10/2014 (Info 551)"]
   ],"",["fgv"],""],
  ["Latrocínio: crime único",[
    ["Atual","Subtraído um só patrimônio, a pluralidade de vítimas da violência não impede o reconhecimento de crime único de latrocínio.","STJ. 3ª Seção. AgRg no AREsp 2.119.185-RS, Rel. Min. Laurita Vaz, julgado em 13/9/2023 (Info 789)"],
    ["STF","A pluralidade de vítimas atingidas pela violência no crime de roubo com resultado morte ou lesão grave, embora único o patrimônio lesado, não altera a unidade do crime, devendo essa circunstância ser sopesada na individualização da pena.","STF. 2ª Turma. HC 96736, Rel. Min. Teori Zavascki, julgado em 17/09/2013"]
   ],"mud",["fgv"],"Overruling: o STJ contava um latrocínio por vítima da violência. Alinhou-se ao STF; a pluralidade de mortes vai para a pena-base."],
  ["Latrocínio tentado e lesões",[
    ["","A jurisprudência do STJ pacificou-se no sentido de que o crime de latrocínio tentado se caracteriza independentemente da natureza das lesões sofridas pela vítima (se leves, graves, gravíssimas), bastando que o agente, no decorrer do roubo, tenha agido com o desígnio de matá-la.","STJ. 5ª Turma. HC 201175-MS, Rel. Min. Jorge Mussi, julgado em 23/4/2013 (Info 521)"]
   ],"",["fgv"],"Súmula 610-STF: Há crime de latrocínio, quando o homicídio se consuma, ainda que não realize o agente a subtração de bens da vítima."],
  ["Latrocínio: concausa preexistente",[
    ["","A existência de doença cardíaca de que padecia a vítima configura-se como concausa preexistente relativamente independente, não sendo possível afastar o resultado mais grave (morte) e, por consequência, a imputação de latrocínio.","STJ. 6ª Turma. HC 704.718-SP, Rel. Min. Laurita Vaz, julgado em 16/5/2023 (Info 777)"]
   ],"",["fgv"],"Idoso de 84 anos amarrado e amordaçado morreu de infarto. Nem a imputação objetiva afasta o resultado."],
  ["Latrocínio e coautor que não atirou",[
    ["Regra","Em regra, o coautor que participa de roubo armado responde pelo latrocínio ainda que o disparo tenha sido efetuado só pelo comparsa. Essa é a jurisprudência do STJ e do STF. Entretanto, se um dos agentes quis participar de crime menos grave, ser-lhe-á aplicada a pena deste. Logo, se o coautor que não atirou não queria participar do latrocínio, não responderá por esse crime mais grave.","STF. 1ª Turma. HC 109151/RJ, Rel. Min. Rosa Weber, julgado em 12/6/2012 (Info 670)"],
    ["Assumiu o risco","Aquele que se associa a comparsa para a prática de roubo, sobrevindo a morte da vítima, responde pelo crime de latrocínio, ainda que não tenha sido o autor do disparo fatal ou que sua participação se revele de menor importância.","STF. 1ª Turma. RHC 133575/PR, Rel. Min. Marco Aurélio, julgado em 21/2/2017 (Info 855)"]
   ],"",["fgv"],"Os dois julgados convivem: a cooperação dolosamente distinta (art. 29, §2º) só socorre quem não assumiu o risco da morte. No Info 855, as vítimas ficaram em cativeiro sob a mira de arma."],
  ["Simulacro",[
    ["Tema 1171","A utilização de simulacro de arma configura a elementar grave ameaça do tipo penal do roubo, subsumindo à hipótese legal que veda a substituição da pena.","STJ. 3ª Seção. REsp 1.994.182-RJ, Rel. Min. Sebastião Reis Júnior, julgado em 13/12/2023 (Recurso Repetitivo - Tema 1171) (Info 799)"]
   ],"",["fgv"],"Simulacro configura a grave ameaça, mas não majora: não é arma branca nem arma de fogo."],
  ["Arma de fogo: perícia",[
    ["","O reconhecimento da referida causa de aumento prescinde (dispensa) da apreensão e da realização de perícia na arma, desde que o seu uso no roubo seja provado por outros meios de prova, tais como a palavra da vítima ou mesmo de testemunhas.","STF. 1ª Turma. HC 108034/MG, rel. Min. Rosa Weber, julgado em 05/06/2012 (Info 674); STJ. 5ª Turma. AgRg no AREsp 1076476/RO, Rel. Min. Jorge Mussi, julgado em 04/10/2018; STJ. 6ª Turma. AgRg no HC 449102/MS, Rel. Min. Nefi Cordeiro, julgado em 09/10/2018"]
   ],"",["fgv"],"Hoje o emprego de arma de fogo no roubo é a majorante do §2º-A, I (+2/3)."],
  ["Arma branca: cabo de vassoura",[
    ["","O conceito de arma branca abrange instrumentos capazes de causar dano à integridade física, ainda que não sejam fabricados com essa finalidade, como um cabo de vassoura (arma branca imprópria).",""],
    ["","A realização de perícia não é necessária para a aplicação da majorante do art. 157, § 2º, VII, do CP, podendo o juiz se valer de outros meios de prova, como os depoimentos das vítimas.","STJ. 5ª Turma. AREsp 2.589.697-DF, Rel. Min. Daniela Teixeira, julgado em 11/2/2025 (Info 842)"]
   ],"",["nov","fgv"],""],
  ["Arma branca: abolitio de 2018",[
    ["","O emprego de arma branca deixou de ser majorante do crime de roubo com a modificação operada pela Lei nº 13.654/2018, que revogou o inciso I do § 2º do art. 157 do Código Penal. Diante disso, constata-se que houve abolitio criminis, devendo a Lei nº 13.654/2018 ser aplicada retroativamente para excluir a referida causa de aumento da pena imposta aos réus condenados por roubo majorado pelo emprego de arma branca.","STJ. 5ª Turma. REsp 1519860/RJ, Rel. Min. Jorge Mussi, julgado em 17/05/2018 (Info 626); STJ. 6ª Turma. AgRg no AREsp 1249427/SP, Rel. Min. Maria Thereza de Assis Moura, julgado em 19/06/2018"]
   ],"sup",["fgv"],"A Lei 13.964/2019 incluiu o inciso VII no §2º e a arma branca voltou a majorar. Por ser mais gravosa, só vale para fatos posteriores ao Pacote Anticrime."],
  ["Arma branca na pena-base (janela 2018 e 2019)",[
    ["Tema 1110","1. Em razão da novatio legis in mellius engendrada pela Lei nº 13.654/2018, o emprego de arma branca, embora não configure mais causa de aumento do crime de roubo, poderá ser utilizado como fundamento para a majoração da pena-base, quando as circunstâncias do caso concreto assim justificarem. 2. O julgador deve fundamentar o novo apenamento ou justificar a não realização do incremento na basilar, nos termos do que dispõe o art. 387, II e III, do CPP. 3. Não cabe a esta Corte Superior a transposição valorativa da circunstância para a primeira fase da dosimetria ou mesmo compelir que o Tribunal de origem assim o faça, em razão da discricionariedade do julgador ao aplicar a novatio legis in mellius.","STJ. 3ª Seção. REsp 1921190-MG, Rel. Min. Joel Ilan Paciornik, julgado em 25/05/2022 (Recurso Repetitivo - Tema 1110) (Info 738); no mesmo sentido, STJ. 5ª Turma. HC 556629-RJ, Rel. Min. Ribeiro Dantas, julgado em 03/03/2020 (Info 668)"]
   ],"par",["fgv"],"Vale para os fatos regidos pela Lei 13.654/2018 (de 24/4/2018 até o Pacote Anticrime). Para fatos posteriores, arma branca é majorante do §2º, VII."],
  ["Revogação do inciso I: constitucional",[
    ["Tema 1120","Em respeito ao princípio da separação dos poderes, previsto no art. 2º da Constituição Federal, quando não caracterizado o desrespeito às normas constitucionais, é defeso ao Poder Judiciário exercer o controle jurisdicional em relação à interpretação do sentido e do alcance de normas meramente regimentais das Casas Legislativas, por se tratar de matéria interna corporis.","STF. Plenário. RE 1297884/DF, Rel. Min. Dias Toffoli, julgado em 11/6/2021 (Info 1021); tese retificada: STF. Plenário. RE 1.297.884-ED/DF, redator do acórdão Min. Gilmar Mendes, julgado em 30/6/2023 (Repercussão Geral - Tema 1120)"]
   ],"",[],"O art. 4º da Lei 13.654/2018, que revogou o inciso I do §2º, não tem vício formal."],
  ["Concurso com inimputável",[
    ["","Se um maior de idade pratica o roubo juntamente com um inimputável, esse roubo será majorado pelo concurso de pessoas (art. 157, § 2º do CP).","STF. 1ª Turma. HC 110425/ES, rel. Min. Dias Toffoli, 5/6/2012 (Info 668); STJ. 6ª Turma. HC 150849/DF, Rel. Min. Sebastião Reis Júnior, julgado em 16/08/2011"]
   ],"",["fgv"],""],
  ["Transporte de valores",[
    ["","Quando o dispositivo fala em “transporte de valores” não se restringe a dinheiro em espécie, abrangendo outros bens e produtos que possuam expressão econômica.","STJ. 5ª Turma. REsp 1309966-RJ, Min. Rel. Laurita Vaz, julgado em 26/8/2014 (Info 548)"]
   ],"",["fgv"],"Funcionários dos Correios com cosméticos de alto valor. O agente precisa conhecer a circunstância."],
  ["Pluralidade de majorantes",[
    ["Súmula 443-STJ","Se houver pluralidade de causas de aumento no crime de roubo (art. 157, § 2º do CP), o juiz não poderá incrementar a pena aplicada com base unicamente no número de majorantes nem se valer de tabelas com frações matemáticas de aumento.","STF. 2ª Turma. RHC 116676/MG, Rel. Min. Ricardo Lewandowski, julgado em 20/8/2013 (Info 716)"]
   ],"",["fgv"],"Súmula 443-STJ: O aumento na terceira fase de aplicação da pena no crime de roubo circunstanciado exige fundamentação concreta, não sendo suficiente para a sua exasperação a mera indicação do número de majorantes."],
  ["Roubo de uso",[
    ["","Furto de uso: NÃO é crime (fato atípico). Roubo de uso: É crime (configura o art. 157 do CP).","STJ. 5ª Turma. REsp 1323275-GO, Rel. Min. Laurita Vaz, julgado em 24/4/2014 (Info 539)"]
   ],"",["fgv"],""],
  ["Simulação com o funcionário",[
    ["","Configura o crime de roubo (e não estelionato) a conduta do funcionário de uma empresa que combina com outro indivíduo para que este simule que assalta o empregado com uma arma de fogo e, dessa forma, leve o dinheiro da empresa.","STF. 1ª Turma. HC 147584/RJ, Rel. Min. Marco Aurélio, julgado em 2/6/2020 (Info 980)"]
   ],"",["fgv"],"Havia outro funcionário, que não sabia do plano e também foi ameaçado."],
  ["Dívida de táxi",[
    ["","A dívida de corrida táxi não pode ser considerada coisa alheia móvel para fins de configuração da tipicidade dos delitos patrimoniais.","STJ. 6ª Turma. REsp 1757543-RS, Rel. Min. Antonio Saldanha Palheiro, julgado em 24/09/2019 (Info 658)"]
   ],"",["fgv"],"Passageiro que mata o taxista para não pagar a corrida não comete latrocínio."],
  ["Prostituta e o cordão do cliente",[
    ["","A prostituta maior de idade e não vulnerável que, considerando estar exercendo pretensão legítima, arranca cordão do pescoço de seu cliente pelo fato de ele não ter pago pelo serviço sexual combinado e praticado consensualmente, pratica o crime de exercício arbitrário das próprias razões (art. 345 do CP) e não roubo (art. 157 do CP).","STJ. 6ª Turma. HC 211888-TO, Rel. Min. Rogerio Schietti Cruz, julgado em 17/5/2016 (Info 584)"]
   ],"",["fgv"],""],
  ["Roubo à noite e pena-base",[
    ["","A prática de roubo no período noturno, por si só, não justifica a exasperação da pena-base, pois tal circunstância não é reveladora da maior gravidade do modus operandi.","STJ. 6ª Turma. AgRg no AREsp 2.650.518-MG, Rel. Min. Otávio de Almeida Toledo (Desembargador convocado do TJSP), julgado em 8/4/2025 (Info 847)"]
   ],"",["nov","fgv"],"No roubo não existe majorante de repouso noturno; ela é exclusiva do furto."],
  ["Adolescente a caminho da escola",[
    ["","O roubo praticado contra menor de idade no caminho da escola supera a reprovabilidade da conduta e justifica o aumento da pena-base.","STJ. 6ª Turma. AgRg no AREsp 2.603.711-AL, Rel. Min. Rogerio Schietti Cruz, julgado em 18/2/2025 (Info 843)"]
   ],"",["nov"],""]
];
JURIS.extorsao = [
  ["Tentativa: vítima não se submete",[
    ["2026","O crime de extorsão, embora formal, admite tentativa quando a vítima, apesar da ameaça, não pratica qualquer conduta em decorrência do constrangimento.","STJ. 3ª Seção. EAREsp 2.819.893-SP, Rel. Min. Ribeiro Dantas, julgado em 10/6/2026 (Info 895)"],
    ["2012","Não se consuma o crime de extorsão quando, apesar de ameaçada, a vítima não se submete à vontade do criminoso, ou seja, não assume o comportamento exigido pelo agente. Nesse caso, haverá tentativa de extorsão.","STJ. 6ª Turma. REsp 1094888-SP, Rel. Min. Sebastião Reis Júnior, julgado em 21/8/2012 (Info 502)"]
   ],"",["nov","fgv"],"Súmula 96-STJ continua: a extorsão consuma independentemente da obtenção da vantagem. Mas a consumação exige que a vítima faça, tolere ou deixe de fazer algo. Caso de 2026: a vítima só acionou a polícia, e a agente foi presa ao buscar o dinheiro."],
  ["Mal espiritual",[
    ["","Configura o delito de extorsão (art. 158 do CP) a conduta do agente que submete vítima à grave ameaça espiritual que se revelou idônea a atemorizá-la e compeli-la a realizar o pagamento de vantagem econômica indevida.","STJ. 6ª Turma. REsp 1.299.021-SP, Rel. Min. Rogerio Schietti Cruz, julgado em 14/2/2017 (Info 598)"]
   ],"",["fgv"],""],
  ["Ameaça econômica",[
    ["","O STJ decidiu que a extorsão pode ser feita mediante ameaça de causar um prejuízo econômico. Assim, não se exige que a ameaça se dirija apenas contra a integridade física ou moral da vítima.",""],
    ["","Pode configurar o crime de extorsão a exigência de pagamento em troca da devolução do veículo furtado, sob a ameaça de destruição do bem.","STJ. 5ª Turma. REsp 1.207.155-RS, Rel. Min. Sebastião Reis Júnior, julgado em 7/11/2013 (Info 531)"]
   ],"",["fgv"],""],
  ["§1º incide no §3º",[
    ["","Essa causa de aumento prevista no § 1º do art. 158 do CP pode ser aplicada tanto para a extorsão simples (caput do art. 158) como também para o caso de extorsão qualificada pela restrição da liberdade da vítima (§ 3º).","STJ. 5ª Turma. REsp 1353693-RS, Rel. Min. Reynaldo Soares da Fonseca, julgado em 13/9/2016 (Info 590)"]
   ],"",["fgv"],""]
];
JURIS.apropriacao = [
  ["Sócio depositário de bens penhorados",[
    ["1","Os bens da pessoa jurídica, mesmo quando sob administração de seu sócio, configuram “coisa alheia” para fins de incidência do art. 168, § 1º, II, do CP.",""],
    ["2","O sócio-administrador nomeado depositário judicial responde penalmente por apropriação indébita qualificada se se apropria ou deixa de restituir bens penhorados pertencentes à sociedade empresária, independentemente de eventuais vínculos societários.",""],
    ["3","A destinação irregular dos bens, perpetrada por aquele que detém a posse qualificada em razão de depósito judicial, enquadra-se no tipo penal previsto no art. 168, § 1º, II, do CP.","STJ. 5ª Turma. REsp 2.215.933-SC, Rel. Min. Ribeiro Dantas, julgado em 2/9/2025 (Info 861)"]
   ],"",["nov","fgv"],"Os informativos falam em “apropriação indébita qualificada”, mas tecnicamente o §1º é majorante (+1/3)."],
  ["Depositário de penhora sobre faturamento",[
    ["STJ: SIM","O fiel depositário de penhora judicial sobre o faturamento está sujeito às penas previstas no art. 168, § 1º, II, do Código Penal.","STJ. 6ª Turma. AgRg no REsp 1.871.947/PR, Rel. Min. Rogerio Schietti Cruz, julgado em 26/4/2022; STJ. 6ª Turma. AgRg no REsp 1.853.281/PR, Rel. Min. Antonio Saldanha Palheiro, julgado em 13/3/2023"],
    ["STF: NÃO","O sócio-administrador, nomeado depositário judicial, que deixa de depositar, em Juízo, parte do faturamento da sociedade empresária, não comete o crime de apropriação indébita, porquanto falta a elementar do tipo “alheia”.","STF. 2ª Turma. HC 203217, Rel. Min. Gilmar Mendes, julgado em 25/10/2021; STF. 2ª Turma. HC 215.102/PR, Rel. Min. Dias Toffoli, redator do acórdão Min. Nunes Marques, julgado em 17/10/2023 (Info 1113)"]
   ],"div",["fgv"],"Para a 2ª Turma do STF, o caso equivale à prisão do depositário infiel (SV 25). Não confunda com o Info 861: lá eram bens penhorados da sociedade, e não parte do faturamento."],
  ["Síndico do §1º, II",[
    ["","O “síndico” mencionado no inciso II do § 1º, do art. 168, do Código Penal é o síndico da massa falida (atualmente denominado “administrador judicial” da falência ou recuperação judicial - Lei nº 11.101/2005), e não o síndico de condomínio edilício.","STJ. 5ª Turma. REsp 1552919-SP, Rel. Min. Reynaldo Soares da Fonseca, julgado em 24/5/2016 (Info 584)"]
   ],"",["fgv"],"O síndico de condomínio que se apropria de valores responde por apropriação simples (ou com a majorante do inciso III, se for o caso de profissão)."],
  ["Inadimplemento contratual",[
    ["","O simples descumprimento de uma obrigação contratual, sem que ocorra a indicação de elementos concretos do ilícito penal, não pode ensejar uma ação penal contra o inadimplente.","STJ. 6ª Turma. HC 174013-RJ, Rel. Min. Og Fernandes, julgado em 20/6/2013 (Info 527)"]
   ],"",[],"Advogado que recebeu parte dos honorários e não ajuizou a ação: atípico."],
  ["Acordo cível antes da denúncia",[
    ["","O STF, com base em peculiaridades do caso concreto, decidiu trancar a ação penal por falta de justa causa.","STF. 1ª Turma. RHC 125283/SP, Rel. Min. Marco Aurélio, julgado em 4/8/2015 (Info 793)"]
   ],"",[],"Advogada que reteve valores do cliente e devolveu em acordo homologado na ação de cobrança, quase um ano antes da denúncia. Decisão excepcional; a regra é o arrependimento posterior (art. 16)."]
];
JURIS.apropprev = [
  ["Crime material",[
    ["Tema 1166","O crime de apropriação indébita previdenciária, previsto no art. 168-A, § 1º, I, do Código Penal, possui natureza de delito material, que só se consuma com a constituição definitiva, na via administrativa, do crédito tributário, consoante o disposto na Súmula Vinculante n. 24 do Supremo Tribunal Federal.","STJ. 3ª Seção. REsp 1.982.304-SP, Rel. Min. Laurita Vaz, julgado em 17/10/2023 (Recurso Repetitivo - Tema 1166) (Info 792)"]
   ],"",["fgv"],""],
  ["Prescrição suspensa",[
    ["","A prescrição da pretensão punitiva do crime de apropriação indébita previdenciária (art. 168-A do CP) permanece suspensa enquanto a exigibilidade do crédito tributário estiver suspensa em razão de decisão de antecipação dos efeitos da tutela no juízo cível.","STJ. 5ª Turma. RHC 51596-SP, Rel. Min. Felix Fischer, julgado em 3/2/2015 (Info 556)"]
   ],"",[],""]
];
JURIS.dano = [
  ["Dolo específico (animus nocendi)",[
    ["","É imprescindível o dolo específico de destruir, inutilizar ou deteriorar coisa alheia para a configuração do crime previsto no art. 163, parágrafo único, III, do Código Penal, pois a vontade do agente deve estar direcionada a causar prejuízo patrimonial ao dono do bem.","STJ. 6ª Turma. HC 916.770-SC, Rel. Min. Sebastião Reis Júnior, julgado em 30/4/2025 (Info 856)"]
   ],"",["nov","fgv"],"Réu em fuga perdeu o controle do carro e atingiu a viatura: absolvido. Não existe dano culposo no CP."],
  ["Entes fora do rol antes da Lei 13.531/2017",[
    ["","Não se enquadra como dano qualificado a lesão a bens das entidades não previstas expressamente no rol do art. 163, parágrafo único, inciso III, do Código Penal, em sua redação originária - anterior à alteração legislativa promovida pela Lei n. 13.531/2017 -, em razão da vedação da analogia in malam partem no sistema penal brasileiro.","STJ. 3ª Seção. EREsp 1896620-ES, Rel. Min. Joel Ilan Paciornik, julgado em 2/3/2023 (Info 768)"],
    ["Distrito Federal","É inadmissível a realização de analogia in malam partem a fim de ampliar o rol contido no art. 163, III, do CP, incluindo o Distrito Federal.","STJ. 6ª Turma. HC 154051-DF, Rel. Min. Maria Thereza de Assis Moura, julgado em 4/12/2012 (Info 515)"],
    ["Caixa Econômica","O STJ entendia que dano doloso praticado contra a Caixa Econômica Federal era considerado como crime de dano simples (art. 163, caput, do CP), não podendo ser caracterizado como dano qualificado (art. 163, parágrafo único, III).","STJ. 5ª Turma. RHC 57544-SP, Rel. Min. Leopoldo de Arruda Raposo (Desembargador convocado do TJ-PE), julgado em 6/8/2015 (Info 567)"]
   ],"sup",["fgv"],"A Lei 13.531/2017 incluiu DF, autarquias, fundações públicas e empresas públicas. Vale só para fatos posteriores; para os anteriores, as teses seguem aplicáveis."],
  ["Terra indígena",[
    ["","Se um indivíduo que tinha uma fazenda em uma terra indígena, ao receber ordem para desocupar o local, destrói as acessões (construções e plantações) que havia feito no local, ele pratica, em tese, o delito de dano qualificado (art. 163, parágrafo único, III, do CP). Isso porque essas terras pertencem à União (art. 20, XI, da CF/88), de forma que, consequentemente, as acessões também são patrimônio público federal.","STF. 2ª Turma. Inq 3670/RR, Rel. Min. Gilmar Mendes, julgado em 23/9/2014 (Info 760)"]
   ],"",[],""]
];
JURIS.estelionato = [
  ["Pensão por morte sem fraude nos requisitos",[
    ["","A obtenção de benefício previdenciário, quando não evidenciada fraude no preenchimento dos seus requisitos legais, não caracteriza vantagem indevida para fins de enquadramento típico do crime do art. 171, § 3º, do CP.","STJ. 5ª Turma. AgRg no REsp 2.230.017-PB, Rel. Min. Joel Ilan Paciornik, julgado em 9/12/2025 (Info 878)"]
   ],"",["nov","fgv"],"Casamento formalmente válido, supostamente só para gerar a pensão: atípico. Não se anula casamento pela intenção torpe de um dos nubentes."],
  ["Estelionato judicial",[
    ["","O denominado estelionato judicial é conduta atípica na esfera penal.",""],
    ["","A figura do estelionato judiciário é atípica pela absoluta impropriedade do meio, uma vez que o processo tem natureza dialética, possibilitando o exercício do contraditório e a interposição dos recursos cabíveis, não se podendo falar, no caso, em “indução em erro” do magistrado.","STJ. 6ª Turma. AgRg no HC 841.731-MS, Rel. Min. Sebastião Reis Júnior, julgado em 15/4/2024 (Info 811)"]
   ],"",["nov","fgv"],"O uso de documento falso para embasar a ação pode ser crime autônomo."],
  ["Medidor adulterado x “gato”",[
    ["","A alteração do sistema de medição, mediante fraude, para que aponte resultado menor do que o real consumo de energia elétrica configura estelionato.","STJ. 5ª Turma. AREsp 1.418.119-DF, Rel. Min. Joel Ilan Paciornik, julgado em 07/05/2019 (Info 648)"]
   ],"",["fgv"],"Ligação clandestina (gato) é furto: há subtração. Adulterar o medidor para registrar menos é estelionato."],
  ["Devolução antes da denúncia",[
    ["","Não extingue a punibilidade do crime de estelionato previdenciário (art. 171, § 3º, do CP) a devolução à Previdência Social, antes do recebimento da denúncia, da vantagem percebida ilicitamente.","STJ. 6ª Turma. REsp 1380672-SC, Rel. Min. Rogerio Schietti Cruz, julgado em 24/3/2015 (Info 559)"]
   ],"",["fgv"],"Cabe arrependimento posterior (art. 16). A extinção do art. 9º da Lei 10.684/2003 vale para crimes tributários e para o 168-A, não para o estelionato."],
  ["Súmula 554-STF",[
    ["","A Súmula 554 do STF aplica-se unicamente para o crime de estelionato na modalidade de emissão de cheque sem fundos (art. 171, § 2º, VI). Assim, a referida súmula não se aplica ao estelionato no seu tipo fundamental (art. 171, caput).","STJ. 5ª Turma. HC 280089-SP, Rel. Min. Jorge Mussi, julgado em 18/2/2014 (Info 537)"]
   ],"",["fgv"],"Súmula 554-STF: o pagamento de cheque emitido sem provisão de fundos, após o recebimento da denúncia, não obsta ao prosseguimento da ação penal. A contrario sensu, pago antes da denúncia, não há justa causa (só no §2º, VI)."],
  ["Benefício do falecido: continuidade",[
    ["","Se a pessoa, após a morte do beneficiário, passa a receber mensalmente o benefício em seu lugar, mediante a utilização do cartão magnético do falecido, pratica o crime de estelionato previdenciário (art. 171, § 3º, do CP) em continuidade delitiva.","STJ. 6ª Turma. REsp 1282118-RS, Rel. Min. Maria Thereza de Assis Moura, julgado em 26/2/2013 (Info 516)"]
   ],"",["fgv"],"Diferente do próprio beneficiário que frauda, ou de quem insere dados falsos para beneficiar outrem: aí o crime é único (permanente, para o beneficiário)."],
  ["Não absorvido pelo roubo",[
    ["","O delito de estelionato não será absorvido pelo de roubo na hipótese em que o agente, dias após roubar um veículo e os objetos pessoais dos seus ocupantes, entre eles um talonário de cheques, visando obter vantagem ilícita, preenche uma de suas folhas e, diretamente na agência bancária, tenta sacar a quantia nela lançada.","STJ. 5ª Turma. HC 309939-SP, Rel. Min. Newton Trisotto (Desembargador convocado do TJ-SC), julgado em 28/4/2015 (Info 562)"]
   ],"",["fgv"],""],
  ["Confiança da vítima e pena-base",[
    ["","O cometimento de estelionato em detrimento de vítima que conhecia o autor do delito e lhe depositava total confiança justifica a exasperação da pena-base em razão da consideração desfavorável das circunstâncias do crime.","STJ. 6ª Turma. HC 332676-PE, Rel. Min. Ericson Maranho (Desembargador convocado do TJ/SP), julgado em 17/12/2015 (Info 576)"]
   ],"",[],""],
  ["Médico que bate o ponto e sai",[
    ["","Não se admite a incidência do princípio da insignificância na prática de estelionato qualificado por médico que, no desempenho de cargo público, registra o ponto e se retira do hospital.","STJ. 5ª Turma. AgRg no HC 548869-RS, Rel. Min. Joel Ilan Paciornik, julgado em 12/05/2020 (Info 672)"]
   ],"",["fgv"],"O STJ não admite insignificância no estelionato contra entidade pública (majorante do §3º)."],
  ["Honorários e justiça gratuita",[
    ["","Advogado pode cobrar honorários contratuais de seu cliente no caso de êxito da ação, ainda que este seja beneficiário da justiça gratuita. Não há qualquer ilegalidade ou crime nessa conduta.","STF. 1ª Turma. HC 95058/ES, rel. Min. Ricardo Lewandowski, 4/9/2012 (Info 678)"]
   ],"",[],""],
  ["Competência: art. 70, §4º, CPP",[
    ["Aplicação imediata","Nos crimes de estelionato, quando praticados mediante depósito, por emissão de cheques sem suficiente provisão de fundos em poder do sacado ou com o pagamento frustrado ou por meio da transferência de valores, a competência será definida pelo local do domicílio da vítima, em razão da superveniência de Lei nº 14.155/2021, ainda que os fatos tenham sido anteriores à nova lei.","STJ. 3ª Seção. CC 180832-RJ, Rel. Min. Laurita Vaz, julgado em 25/08/2021 (Info 706)"],
    ["Fora do §4º","No crime de estelionato, não identificadas as hipóteses descritas no § 4º do art. 70 do CPP, a competência deve ser fixada no local onde o agente delituoso obteve, mediante fraude, em benefício próprio e de terceiros, os serviços custeados pela vítima.","STJ. 3ª Seção. CC 185983-DF, Rel. Min. Joel Ilan Paciornik, julgado em 11/05/2022 (Info 736)"],
    ["Cheque fraudado","O crime de estelionato praticado por meio de saque de cheque fraudado compete ao Juízo do local da agência bancária da vítima.","STJ. 3ª Seção. CC 182977-PR, Rel. Min. Laurita Vaz, julgado em 09/03/2022 (Info 728)"],
    ["Fundo estrangeiro","Compete ao juízo estadual processar e julgar crime de estelionato contra fundo estrangeiro no qual os atos desenvolvidos foram praticados em território nacional, ainda que diverso o domicílio de sócio lesado.","STJ. 3ª Seção. AgRg no CC 192.274-RJ, Rel. Min. Ribeiro Dantas, julgado em 8/3/2023 (Info 775)"]
   ],"",["fgv"],"Cheque <b>fraudado</b> (falso) não está no §4º: vale o local da agência. Cheque <b>sem fundos</b> ou com pagamento frustrado está no §4º: domicílio da vítima."],
  ["Representação: retroatividade",[
    ["STF, Plenário","A exigência de representação para estelionato retroage em benefício do réu.","STF. Plenário. HC 208817 AgR, Rel. Min. Cármen Lúcia, julgado em 13/04/2023"]
   ],"sup",["fgv"],"A Lei 15.397/2026 revogou o §5º do art. 171. Desde 4/5/2026, o estelionato voltou a ser de ação pública incondicionada. A tese continua útil para fatos e processos do período em que se exigia representação (Pacote Anticrime até maio de 2026); a nova regra, mais gravosa, não retroage."]

    ["","A teoria monista implica o reconhecimento de que em delitos qualificados todos os agentes em concurso concorrem para esse mesmo delito, sendo prescindível que todos pratiquem os mesmos elementos fáticos do tipo qualificado, bastando apenas a prova do concurso de agentes.","STJ. 5ª Turma. AgRg no AREsp 2.712.504-MG, Rel. Min. Joel Ilan Paciornik, julgado em 9/9/2025 (Info 863)"]

JURIS.estupro = [
  ["Dissenso superveniente",[
    ["","Configura a prática de estupro a continuidade do ato sexual mediante uso de força física após a vítima manifestar que não quer mais continuar, mesmo que o início tenha sido consensual.",""],
    ["","Havendo dissenso superveniente, ou seja, a manifestação de discordância feita pela vítima depois de iniciado o ato, a continuidade da relação mediante uso de força física configura a elementar ‘violência’ do art. 213 do CP, ainda que a relação tenha começado consentida.","STJ. 5ª Turma. AgRg no AREsp 3.089.315-SP, Rel. Min. Reynaldo Soares da Fonseca, julgado em 19/5/2026 (Info 890)"]
   ],"",["nov","fgv"],"Não há erro de tipo se o agente foi informado do dissenso e prosseguiu. A falta de reação física da vítima não exclui o crime."],
  ["Falta de reação e consentimento inicial",[
    ["","Falta de reação enérgica da vítima e consentimento inicial não afastam o crime de estupro.",""],
    ["","O fato de a vítima não ter reagido física ou ferozmente não exclui o crime, já que, no caso concreto, houve o dissenso claro, inclusive, reiterado.","STJ. 6ª Turma. AgRg no REsp 2.105.317-DF, Rel. Min. Jesuíno Rissato (Desembargador convocado do TJDFT), Rel. para acórdão Min. Sebastião Reis Júnior, julgado em 13/08/2024 (Info 822)"]
   ],"",["nov","fgv"],"Mensagens amigáveis trocadas depois com o agressor também não afastam o crime."],
  ["Dolo sem intenção lasciva",[
    ["","O dolo no crime de estupro consiste na vontade de constranger a vítima à prática de ato libidinoso, não sendo necessária a intenção de satisfazer a lascívia. O art. 213 do CP não exige a satisfação da lascívia como elemento subjetivo do tipo.",""],
    ["","A motivação do agente (prazer sexual, vingança, humilhação ou correção) é irrelevante para a configuração do crime de estupro.","STJ. 5ª Turma. REsp 2.211.166-MG, Rel. Min. Joel Ilan Paciornik, julgado em 12/8/2025 (Info 862)"]
   ],"",["nov","fgv"],"Pai que, com violência, apalpa e introduz o dedo na vagina da filha de 15 anos para verificar a virgindade: estupro. A FGV cobrou o mesmo caso (TJ-PA 2026)."],
  ["Simulacro de arma",[
    ["","A simulação de arma de fogo pode sim configurar a “grave ameaça”. Isso porque a “grave ameaça” deve ser analisada com base no sentimento unilateral que é provocado no espírito da vítima subjugada. A existência de grave ameaça não depende do risco objetivo e concreto a que a vítima foi efetivamente submetida.","STJ. 6ª Turma. REsp 1916611-RJ, Rel. Min. Olindo Menezes (Desembargador convocado do TRF 1ª Região), julgado em 21/09/2021 (Info 711)"]
   ],"",["fgv"],"Afasta a desclassificação para importunação sexual."],
  ["Tipo misto alternativo",[
    ["","O estupro (art. 213 do CP), com redação dada pela Lei 12.015/2009, é tipo penal misto alternativo. Logo, se o agente, no mesmo contexto fático, pratica conjunção carnal e outro ato libidinoso contra uma só vítima, pratica um só crime do art. 213 do CP.",""],
    ["","A Lei 12.015/2009, ao revogar o art. 214 do CP, não promoveu a descriminalização do atentado violento ao pudor (não houve abolitio criminis). Ocorreu, no caso, a continuidade normativo-típica, considerando que a nova Lei inseriu a mesma conduta no art. 213.","STJ. 5ª Turma. AgRg no REsp 1262650/RS, Rel. Min. Regina Helena Costa, julgado em 05/08/2014; STJ. 6ª Turma. HC 212305/DF, Rel. Min. Marilza Maynard (Des. Conv. TJ/SE), julgado em 24/04/2014 (Info 543)"]
   ],"",["fgv"],"A unificação retroage: quem foi condenado por estupro e atentado violento ao pudor no mesmo contexto passa a responder por crime único."],
  ["Beijo roubado com violência",[
    ["","O agente abordou de forma violenta e sorrateira a vítima com a intenção de satisfazer sua lascívia, o que ficou demonstrado por sua declarada intenção de \u0022ficar\u0022 com a jovem, adolescente de 15 anos, e pela ação de impingir-lhe, à força, um beijo, após ela ser derrubada ao solo e mantida subjugada pelo agressor, que a imobilizou pressionando o joelho sobre seu abdômen. Tal conduta configura o delito do art. 213, § 1º do CP.","STJ. 6ª Turma. REsp 1611910-MT, Rel. Min. Rogerio Schietti Cruz, julgado em 11/10/2016 (Info 592)"]
   ],"",["fgv"],""],
  ["Súmula 608-STF e violência real",[
    ["Súmula 608-STF","No crime de estupro, praticado mediante violência real, a ação penal é pública incondicionada.",""],
    ["","O entendimento dessa súmula pode ser aplicado independentemente da existência da ocorrência de lesões corporais nas vítimas de estupro. A violência real se caracteriza não apenas nas situações em que se verificam lesões corporais, mas sempre que é empregada força física contra a vítima, cerceando-lhe a liberdade de agir segundo a sua vontade.","STF. 2ª Turma. RHC 117978, Rel. Min. Dias Toffoli, julgado em 05/06/2018 (Info 905); STF. 1ª Turma. HC 125360/RJ, red. p/ o ac. Min. Alexandre de Moraes, julgado em 27/2/2018 (Info 892)"]
   ],"par",["fgv"],"Desde a Lei 13.718/2018, todos os crimes dos Caps. I e II do Título VI são de ação pública incondicionada (art. 225). A súmula só interessa para fatos anteriores."]
];
JURIS["estupro-vulneravel"] = [
  ["Súmula 593-STJ",[
    ["Súmula 593-STJ","O crime de estupro de vulnerável configura-se com a conjunção carnal ou prática de ato libidinoso com menor de 14 anos, sendo irrelevante o eventual consentimento da vítima para a prática do ato, experiência sexual anterior ou existência de relacionamento amoroso com o agente.","STJ. 3ª Seção. Aprovada em 25/10/2017, DJe 06/11/2017 (Info 555)"]
   ],"",["fgv"],"A Lei 15.353/2026 levou a regra para o próprio art. 217-A (§§4º-A e 5º)."],
  ["Distinguishing (relativização) antes da Lei 15.353/2026",[
    ["2023 (Info 777)","Admite-se o distinguishing quanto ao Tema 918/STJ (REsp 1.480.881/PI), na hipótese em que a diferença de idade entre o acusado e a vítima não se mostrou tão distante quanto do acórdão paradigma (o réu possuía 19 anos de idade, ao passo que a vítima contava com 12 anos de idade), bem como há concordância dos pais da menor somado a vontade da vítima de conviver com o réu e o nascimento do filho do casal, o qual foi registrado pelo genitor.","STJ. 6ª Turma. REsp 1.977.165/MS, Rel. Min. Olindo Menezes (Desembargador convocado do TRF1), Rel. para acórdão Min. Sebastião Reis Júnior, julgado em 16/5/2023 (Info 777)"],
    ["2023 (Info 16)","Admite-se o distinguishing quanto ao Tema 918/STJ, na hipótese em que a diferença de idade entre o acusado e a vítima não se mostrou tão distante quanto do acórdão sob a sistemática dos recursos repetitivos (no caso, o réu possuía 19 anos de idade, ao passo que a vítima contava com 12 anos de idade), aliado ao fato de a menor viver maritalmente com o acusado desde o nascimento da filha do casal, devidamente reconhecida, o que denota que não houve afetação relevante do bem jurídico a resultar na atuação punitiva estatal.","STJ. 6ª Turma. AgRg no REsp 2.015.310/MG, Rel. Min. Jesuíno Rissato (Desembargador convocado do TJDFT), julgado em 12/9/2023 (Info 16, Edição Extraordinária)"],
    ["2024 (Info 807)","A conduta de estupro de vulnerável imputada a um jovem de 20 anos, trabalhador rural e com pouca escolaridade, que se relacionou com uma adolescente de 12 anos, que havia sido, em um primeiro momento, aceito pela família da adolescente, sobrevindo uma filha e a efetiva constituição de núcleo familiar, apesar de não estarem mais juntos como casal, embora formalmente típica, não constitui infração penal, tendo em vista o reconhecimento da ausência de culpabilidade por erro de proibição, bem como pelo fato de que se deve garantir proteção integral à criança que nasceu dessa relação.","STJ. 5ª Turma. AgRg no AREsp 2.389.611-MG, Rel. Min. Reynaldo Soares da Fonseca, julgado em 12/3/2024 (Info 807)"],
    ["2024 (Info 21)","Admite-se o distinguishing quanto ao Tema 918/STJ (REsp 1.480.881/PI), na hipótese em que a diferença de idade entre o acusado e a suposta vítima, esta com 13 anos e aquele com 23 anos de idade, não se mostrou tão distante quanto a diferença do acórdão paradigma; bem como porque houve consentimento da adolescente, além de ocorrido relacionamento amoroso entre ambos.","STJ. 6ª Turma. AgRg no REsp 2.029.697/MG, Rel. Min. Jesuíno Rissato (Desembargador convocado do TJDFT), julgado em 14/5/2024 (Info 21, Edição Extraordinária)"],
    ["2024 (Info 820)","É possível, no entanto, o reconhecimento da atipicidade de conduta que poderia configurar o crime de estupro de vulnerável, quando as circunstâncias fáticas verificadas (consentimento da família da vítima, inclusive abrigando o casal por período de tempo, e a manutenção do relacionamento até os dias atuais, inclusive com nascimento de filho fruto da relação), indicam que o bem jurídico tutelado não foi vulnerado.","STJ. 6ª Turma. Resp 2.144.411/AL, Rel. Min. Sebastião Reis Júnior, julgado em 6/8/2024 (Info 820)"],
    ["2026 (Info 876)","É possível, no entanto, o reconhecimento da atipicidade material da conduta formalmente típica, quando as circunstâncias fáticas do caso concreto demonstram ausência de efetiva lesão ao bem jurídico tutelado. Isso afasta a configuração do crime e impede a punição do agente.","STJ. 6ª Turma. HC 860.538-PE, Rel. Min. Sebastião Reis Júnior, julgado em 3/2/2026 (Info 876)"],
    ["2026 (Info 897)","Em hipóteses excepcionalíssimas anteriores à Lei nº 15.353/2026, admite-se o distinguishing em relação a essa presunção de vulnerabilidade, afastando-se a intervenção penal quando presentes circunstâncias como diferença etária reduzida, anuência familiar, relação afetiva estável, formação de família, geração de filho e inexistência de situação de violência ou abuso.","STJ. 5ª Turma. REsp 2.260.615-PR, Rel. Min. Messod Azulay Neto, julgado em 9/6/2026 (Info 897)"]
   ],"sup",["nov","fgv"],"A Lei 15.353, de 8/3/2026, incluiu o §4º-A (presunção absoluta, inadmissível a relativização) e reescreveu o §5º (penas independentemente de consentimento, experiência sexual, relações anteriores ou gravidez). Para fatos posteriores, não cabe mais distinguishing. Para fatos anteriores, o próprio STJ continua admitindo (Info 897), porque a lei nova é mais gravosa."],
  ["Sem distinguishing: falta de anuência ou diferença de idade",[
    ["Info 803","A constituição de família não exclui, per se, a punibilidade do crime de estupro de vulnerável.","STJ. 6ª Turma. AgRg no HC 849.912/MG, Rel. Min. Rogerio Schietti Cruz, julgado em 20/2/2024 (Info 803)"],
    ["Info 787","Não cabe a distinção realizada no julgamento do REsp 1.977.165/MS - caso de dois jovens namorados, cujo relacionamento tinha aquiescência dos genitores da vítima, sobrevindo um filho - na hipótese em que não há consentimento da responsável legal - o que impossibilita qualquer relativização da presunção de vulnerabilidade de menor de 14 anos no crime de estupro de vulnerável.","STJ. 6ª Turma. AgRg no REsp 1.979.739/MT, Rel. Min. Laurita Vaz, julgado em 14/8/2023 (Info 787)"],
    ["Info 769","Assim, aqui, neste caso concreto, não se admitiu qualquer relativização da presunção de vulnerabilidade do menor de 14 anos no crime de estupro de vulnerável.","STJ. 5ª Turma. AgRg no HC 804741/MS, Rel. Min. Reynaldo Soares da Fonseca, julgado em 14/3/2023 (Info 769)"]
   ],"",["fgv"],"Info 803: a gravidez torna a conduta mais grave e atrai a majorante do art. 234-A, III. Info 769: homem de 49 anos e adolescente de 13, sem consentimento dos responsáveis."],
  ["Desclassificação para importunação: não cabe",[
    ["Tema 1121","Presente o dolo específico de satisfazer à lascívia, própria ou de terceiro, a prática de ato libidinoso com menor de 14 anos configura o crime de estupro de vulnerável (art. 217-A do CP), independentemente da ligeireza ou da superficialidade da conduta, não sendo possível a desclassificação para o delito de importunação sexual (art. 215-A do CP).","STJ. 3ª Seção. REsp 1959697-SC, Rel. Min. Ribeiro Dantas, julgado em 08/06/2022 (Recurso Repetitivo - Tema 1121) (Info 740)"],
    ["STF: beijo lascivo","Homem que beijou criança de 5 anos de idade, colocando a língua no interior da boca (beijo lascivo) praticou estupro de vulnerável (art. 217-A do CP), não sendo possível a desclassificação para a contravenção penal de molestamento (art. 65 do DL 3.668/41).","STF. 1ª Turma. HC 134591/SP, rel. orig. Min. Marco Aurélio, red. p/ o ac. Min. Alexandre de Moraes, julgado em 1/10/2019 (Info 954)"]
   ],"",["fgv"],"O art. 65 da LCP (molestamento) foi revogado pela Lei 14.132/2021."],
  ["Vítima dormindo (§1º)",[
    ["","A prática de ato libidinoso com pessoa em estado de sono configura estupro de vulnerável, não sendo possível a desclassificação para importunação sexual.",""],
    ["","A conduta de passar a mão na genitália da vítima enquanto ela dorme configura estupro de vulnerável, pois o estado de sono prejudica a capacidade de resistência.","STJ. 5ª Turma. AgRg no REsp 2.208.531-SP, Rel. Min. Joel Ilan Paciornik, julgado em 5/8/2025 (Info 859)"]
   ],"",["nov","fgv"],"A FGV cobrou o mesmo raciocínio: pai que alisa as nádegas da amiga da filha, de 16 anos, dormindo (TJ-BA 2026)."],
  ["Consumação e tentativa",[
    ["Tentativa (2024)","Não é cabível a modalidade tentada para o crime de estupro de vulnerável, uma vez que qualquer contato libidinoso com menor de 14 anos já consuma o delito, sendo irrelevante se a conduta foi interrompida ou superficial, pois o bem jurídico da dignidade e liberdade sexual da vítima já se encontra violado.","STJ. 5ª Turma. REsp 2.172.883-SP, Rel. Min. Daniela Teixeira, julgado em 10/12/2024 (Info 837)"],
    ["Toques íntimos","Para que o crime seja considerado consumado, não é indispensável que o ato libidinoso praticado seja invasivo (introdução do membro viril nas cavidades da vítima). Logo, toques íntimos podem servir para consumar o delito.","STJ. 6ª Turma. REsp 1309394-RS, Rel. Min. Rogerio Schietti Cruz, julgado em 05/02/2015 (Info 555)"],
    ["Deitar sobre a vítima","A consumação do delito de estupro de vulnerável (art. 217-A do Código Penal) dá-se não apenas quando há conjunção carnal, mas sim todas as vezes em que houver a prática de qualquer ato libidinoso com menor de 14 anos.","STJ. 6ª Turma. REsp 1353575-PR, Rel. Min. Rogerio Schietti Cruz, julgado em 5/12/2013 (Info 533)"],
    ["STF","O agente que passa as mãos nas coxas e seios da vítima menor de 14 anos, por dentro de sua roupa, pratica, em tese, o crime de estupro de vulnerável (art. 217-A do CP).","STF. 1ª Turma. RHC 133121/DF, rel. orig. Min. Marco Aurélio, red. p/o acórdão Min. Edson Fachin julgado em 30/8/2016 (Info 837)"]
   ],"",["fgv"],"Por isso a FGV dá como consumado o caso em que o agente acaricia e é interrompido antes da conjunção carnal (ENAM 2025, TJ-SE 2025, MPE-GO 2026)."],
  ["Sem contato físico",[
    ["Contemplação","Segundo a posição majoritária na doutrina, a simples contemplação lasciva já configura o “ato libidinoso” descrito nos arts. 213 e 217-A do Código Penal, sendo irrelevante, para a consumação dos delitos, que haja contato físico entre ofensor e ofendido.","STJ. 5ª Turma. RHC 70976-MS, Rel. Min. Joel Ilan Paciornik, julgado em 2/8/2016 (Info 587)"],
    ["Mentor intelectual","Para que se configure ato libidinoso, não se exige contato físico entre ofensor e vítima.","STJ. 6ª Turma. HC 478310, Rel. Min. Rogério Schietti, julgado em 09/02/2021 (Info 685)"]
   ],"",["fgv"],""],
  ["Omissão imprópria da irmã",[
    ["","A irmã de vítima do crime de estupro de vulnerável responde por conduta omissiva imprópria se assume o papel de garantidora.","STJ. 5ª Turma. HC 603195-PR, Rel. Min. Ribeiro Dantas, julgado em 06/10/2020 (Info 681)"]
   ],"",["fgv"],"O mero parentesco entre irmãos não cria dever de agir (art. 13, §2º, a). Ela assumiu a responsabilidade (b) e criou o risco (c). A mãe, que tem o dever legal, responde por omissão imprópria (TJ-SC 2024)."],
  ["Prova da idade",[
    ["","Nos crimes sexuais contra vulnerável, quando inexiste certidão de nascimento atestando ser a vítima menor de 14 anos na data do fato criminoso, o STJ tem admitido a verificação etária a partir de outros elementos de prova presentes nos autos.","STJ. 5ª Turma. AgRg no AREsp 12700-AC, Rel. para acórdão Min. Gurgel de Faria, julgado em 10/3/2015 (Info 563)"]
   ],"",[],""],
  ["Continuidade delitiva",[
    ["Tema 1202","No crime de estupro de vulnerável, é possível a aplicação da fração máxima de majoração prevista no art. 71, caput, do Código Penal, ainda que não haja a delimitação precisa do número de atos sexuais praticados, desde que o longo período de tempo e a recorrência das condutas permita concluir que houve 7 (sete) ou mais repetições.","STJ. 3ª Seção. REsps 2.029.482-RJ e REsp 2.050.195-RJ, Rel. Min. Laurita Vaz, julgado em 17/10/2023 (Recurso Repetitivo - Tema 1202) (Info 792)"],
    ["Continuidade específica","A violência de que trata a continuidade delitiva especial (art. 71, parágrafo único, do CP) é a violência real. Assim, não é possível aplicar a continuidade delitiva específica para o estupro de vulnerável (art. 217-A do CP) porque neste crime há uma ficção jurídica de violência, não sendo caso de violência real.","STJ. 5ª Turma. AgRg em ARESP 2.165.385/MG, Rel. Min. Reynaldo Soares da Fonseca, julgado em 5/9/2023 (Info 786)"]
   ],"",["fgv"],"Aplica-se a continuidade comum (art. 71, caput, até 2/3), e não a específica (até o triplo)."],
  ["Ação penal: maioridade posterior",[
    ["","Para crimes do art. 217-A do Código Penal praticados sob a vigência da Lei nº 12.015/2009, a persecução deve ocorrer por meio de ação penal pública incondicionada, conforme o art. 225, parágrafo único, do CPP, não havendo necessidade de representação da vítima.","STJ. 6ª Turma. RHC 206.752-PR, Rel. Min. Sebastião Reis Júnior, julgado em 14/4/2025 (Info 851)"]
   ],"",["nov"],"A vítima que só denuncia depois dos 18 anos não perde nada: não há decadência."],
  ["Competência: violência doméstica contra criança",[
    ["Antes","Após o advento do art. 23 da Lei nº 13.431/2017, nas comarcas em que não houver vara especializada em crimes contra a criança e o adolescente, compete à vara especializada em violência doméstica, onde houver, processar e julgar os casos envolvendo estupro de vulnerável cometido pelo pai (bem como pelo padrasto, companheiro, namorado ou similar) contra a filha (ou criança ou adolescente) no ambiente doméstico ou familiar.","STJ. 3ª Seção. EAREsp 2099532/RJ, Rel. Min. Sebastião Reis Júnior, julgado em 26/10/2022 (Info 755); STJ. 6ª Turma. REsp 2005974/RJ, Rel. Min. Laurita Vaz, julgado em 14/2/2023 (Info 765)"],
    ["Tema 1186","1. A condição de gênero feminino é suficiente para atrair a aplicabilidade da Lei Maria da Penha em casos de violência doméstica e familiar, prevalecendo sobre a questão etária. 2. A Lei Maria da Penha prevalece quando suas disposições conflitarem com as de estatutos específicos, como o da Criança e do Adolescente.","STJ. 3ª Seção. REsp 2.015.598-PA, Rel. Min. Ribeiro Dantas, julgado em 6/2/2025 (Recurso Repetitivo - Tema 1186) (Info 840)"],

const jurisOf = id => (JURIS[id]||[]);
const jPasses = j => state.filter==="all" || state.filter==="juris" || j[3].includes(state.filter);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const allCrimes = []; DATA.forEach(t=>t.caps.forEach(c=>c.crimes.forEach(cr=>allCrimes.push({...cr,cap:c.nome,tit:t.nome,tid:t.id}))));
let state = {tema:"orcrim", open:new Set(), closed:new Set(), cmp:(store.get("cmp")||"t2"), view:"fichas", filter:"all", crime:(location.hash.slice(1)||store.get("crime")||"homicidio"), q:""};
if(!allCrimes.find(c=>c.id===state.crime)) state.crime="homicidio";

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s=>s.replace(/<[^>]+>/g,"");
const norm = s=>strip(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

function tagHtml(tags){
  return tags.map(t=>{
    if(t==="nov") return '<span class="tag nov">Novidade</span>';
    if(t==="fgv") return '<span class="tag fgv">FGV</span>';
    if(t.startsWith("lei:")) return '<span class="tag lei">Lei '+esc(t.slice(4))+'</span>';
    if(KIND[t]) return '<span class="k k-'+t+'">'+KIND[t]+'</span>';
    return "";
  }).join("");
}
const passes = tags => state.filter==="all" || tags.includes(state.filter);
function countFor(cr){
  if(state.filter==="all") return "";
  let n=cr.penas.filter(p=>passes(p[3])).length;
  cr.secoes.forEach(s=>s.itens.forEach(i=>{if(passes(i[2]))n++}));
  if(state.filter!=="Q" && state.filter!=="M") n+=jurisOf(cr.id).filter(jPasses).length;
  return n||"";
}

function renderTree(){
  let h="";
