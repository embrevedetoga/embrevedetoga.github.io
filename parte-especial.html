  DATA.forEach(t=>{
    const isOpen = state.open.has(t.id) || (cur && cur.tid===t.id && !state.closed.has(t.id));
    const nCr = t.caps.reduce((a,c)=>a+c.crimes.length,0);
    h+='<details class="tgrp" data-t="'+t.id+'"'+(isOpen?' open':'')+'><summary class="tit">'+esc(t.nome)+'<span class="tn">'+nCr+'</span></summary>';
    t.caps.forEach(c=>{
      h+='<p class="cap">'+esc(c.nome)+'</p>';
      c.crimes.forEach(cr=>{
        const n = countFor(cr);
        h+='<a href="#'+cr.id+'" data-c="'+cr.id+'" aria-current="'+(state.view==="fichas"&&state.crime===cr.id)+'"><span class="art">'+esc(cr.art)+'</span><span>'+esc(cr.nome)+'</span>'+(n?'<span class="cnt">'+n+'</span>':'')+'</a>';

    const id=d.dataset.t; if(d.open){state.open.add(id);state.closed.delete(id)} else {state.open.delete(id);state.closed.add(id)}
  }));
}

    });
    h+='</ul></section>';
  });

    shown+=js.length;

      j[1].forEach(t=>{h+='<blockquote class="tese">'+(t[0]?'<span class="tl">'+esc(t[0])+'</span>':'')+esc(t[1])+(t[2]?'<cite>'+esc(t[2])+'</cite>':'')+'</blockquote>'});
      if(j[4]) h+='<p class="obs"><b>Observação:</b> '+esc(j[4])+'</p>';
      h+=(meta?'<div class="meta">'+meta+'</div>':'')+'</div></li>';
    });
    h+='</ul></section>';
  } else if(state.filter==="all"){
    h+='<section class="sec"><header><h3>Jurisprudência</h3></header><p class="juris">Nenhum julgado selecionado ainda para este crime.</p></section>';
  }
  if(!shown) h+='<div class="sec empty">Nada neste filtro para '+esc(cr.nome)+'. Os números no índice mostram onde há itens.</div>';

function cell(c){
  if(!c) return '<td class="none">·</td>';

function renderCmp(){
  const set = CMPSETS.find(x=>x.id===state.cmp)||CMPSETS[0]; const cols=set.cols;

  h+='<div class="cmp-wrap"><table class="cmp" style="min-width:'+(240+cols.length*140)+'px"><thead><tr><th>Circunstância</th>'+cols.map(c=>'<th>'+c[1]+'<span>art. '+c[2]+'</span></th>').join("")+'</tr></thead><tbody>';

function hl(text,q){
  const plain=strip(text); const n=norm(plain); const i=n.indexOf(q);
  if(i<0) return esc(plain);
  return esc(plain.slice(0,i))+'<mark>'+esc(plain.slice(i,i+q.length))+'</mark>'+esc(plain.slice(i+q.length));
}
function renderSearch(){
  const q=norm(state.q.trim()); const res=[];
  allCrimes.forEach(cr=>{
    if(norm(cr.nome+" "+cr.art).includes(q)) res.push({where:cr.art,txt:cr.nome+": "+cr.resumo,go:{crime:cr.id}});
    cr.penas.forEach(p=>{if(norm(p.join(" ")).includes(q)) res.push({where:cr.art+" "+p[1],txt:p[0]+": "+p[2],go:{crime:cr.id}})});
    cr.secoes.forEach(s=>s.itens.forEach(i=>{if(norm(i[0]+" "+i[1]).includes(q)) res.push({where:cr.art+" · "+i[0],txt:i[1],go:{crime:cr.id}})}));
    jurisOf(cr.id).forEach(j=>{const b=j[0]+". "+j[1].map(t=>t[1]+" "+t[2]).join(" ")+" "+(j[4]||""); if(norm(b).includes(q)) res.push({where:cr.art+" · jurisprudência",txt:b,go:{crime:cr.id}})});
  });
  CMPSETS.forEach(set=>set.rows.forEach(r=>{
    const blob=r.g+" "+r.n+" "+(r.nota||"")+" "+set.cols.map(([k])=>r[k]?r[k].join(" "):"").join(" ");
    if(norm(blob).includes(q)) res.push({where:"Comparador · "+set.nome,txt:r.n+(r.nota?". "+r.nota:""),go:{cmp:set.id}});
  }));
  let h='<div class="head"><span class="crumb">Busca</span><h2>'+res.length+' resultado'+(res.length===1?'':'s')+'</h2><p>para “'+esc(state.q.trim())+'”</p></div>';
  if(!res.length) h+='<div class="sec empty">Nada encontrado. Tente o número do parágrafo (§12) ou uma palavra da lei (milícia, escola, gestação).</div>';
  else{
    h+='<section class="sec"><ul class="results">';
    res.slice(0,80).forEach((r,ix)=>{h+='<li><button data-r="'+ix+'"><span class="where">'+esc(r.where)+'</span><span>'+hl(r.txt,q)+'</span></button></li>'});
    h+='</ul></section>';
  }
  $("#main").innerHTML=h;
  $("#main").querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
    const r=res[+b.dataset.r]; state.q=""; $("#q").value="";
    if(r.go.cmp){state.view="cmp"; state.cmp=r.go.cmp} else {state.view="fichas"; state.crime=r.go.crime; store.set("crime",state.crime)}
    render(); window.scrollTo(0,0);
  }));
}

const QK = {Q:"Qualificadora",M:"Causa de aumento (majorante)",A:"Agravante genérica (art. 61)",E:"Elementar do tipo"};
const QMODES = [["nat","Natureza"],["par","Comparação"],["onde","Onde qualifica"],["hed","Hediondez"]];
const qz = {set:"all", modes:["nat","par","onde"], n:10, list:[], i:0, pick:null, hits:0, wrong:[], done:false, started:false};
const qOk = c => c && QK[c[0]];
const shuffle = a => {a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a};
const pickOne = a => a[Math.floor(Math.random()*a.length)];
function qSets(){ return qz.set==="all" ? CMPSETS : CMPSETS.filter(s=>s.id===qz.set) }
function onlyHint(c){ const m=(c[2]||'').match(/só [^·]+/i); return m?' <span class="qz-hint">(hipótese: '+esc(m[0].trim())+')</span>':'' }
function cellTxt(c){ return c[1]+(c[2]?" · "+c[2]:"") }
function buildBank(){
  const bank=[];
  qSets().forEach(set=>set.rows.forEach((r,ri)=>{
    const cells=set.cols.filter(([k])=>qOk(r[k])).map(([k,nome,art])=>({k,nome,art,c:r[k]}));
    const src={set:set.id,setNome:set.nome,row:ri};
    if(qz.modes.includes("nat")) cells.forEach(x=>bank.push({mode:"nat",key:"nat|"+set.id+"|"+ri+"|"+x.k,src,
      stem:'No crime de <b>'+esc(x.nome)+'</b> (art. '+esc(x.art)+'), a circunstância “'+esc(r.n)+'”'+onlyHint(x.c)+' é:',
      opts:Object.keys(QK).map(k=>[k,QK[k]]), ans:x.c[0],
      exp:'<span class="k k-'+x.c[0]+'">'+KIND[x.c[0]]+'</span> '+esc(cellTxt(x.c)), nota:r.nota, row:r, set}));
    if(qz.modes.includes("par")) for(let a=0;a<cells.length;a++) for(let b=a+1;b<cells.length;b++){
      const A=cells[a],B=cells[b]; if(A.c[0]===B.c[0]) continue;
      const right=A.c[0]+B.c[0]; const pool=new Set([right,B.c[0]+A.c[0]]);
      const ks=Object.keys(QK); while(pool.size<4){pool.add(pickOne(ks)+pickOne(ks))}
      bank.push({mode:"par",key:"par|"+set.id+"|"+ri+"|"+A.k+B.k,src,
        stem:'“'+esc(r.n)+'”: no crime de <b>'+esc(A.nome)+'</b> e no de <b>'+esc(B.nome)+'</b>, é, respectivamente:'+((onlyHint(A.c)||onlyHint(B.c))?'<br><span class="qz-hint">'+(onlyHint(A.c)?esc(A.nome)+': '+onlyHint(A.c):'')+' '+(onlyHint(B.c)?esc(B.nome)+': '+onlyHint(B.c):'')+'</span>':''),
        opts:shuffle([...pool]).map(p=>[p,QK[p[0]].split(" (")[0]+' · '+QK[p[1]].split(" (")[0]]), ans:right,
        exp:esc(A.nome)+': <span class="k k-'+A.c[0]+'">'+KIND[A.c[0]]+'</span> '+esc(cellTxt(A.c))+'<br>'+esc(B.nome)+': <span class="k k-'+B.c[0]+'">'+KIND[B.c[0]]+'</span> '+esc(cellTxt(B.c)), nota:r.nota, row:r, set});
    }
    if(qz.modes.includes("onde") && cells.length>=3){
      ["Q","M"].forEach(kk=>{
        const hit=cells.filter(x=>x.c[0]===kk); if(hit.length!==1) return;
        const others=shuffle(cells.filter(x=>x.c[0]!==kk)).slice(0,3); const opts=shuffle([hit[0],...others]);
        bank.push({mode:"onde",key:"onde|"+set.id+"|"+ri+"|"+kk,src,
          stem:'Em qual destes crimes “'+esc(r.n)+'” é <b>'+(kk==="Q"?"qualificadora":"causa de aumento")+'</b>?',
          opts:opts.map(x=>[x.k,x.nome+' (art. '+x.art+')']), ans:hit[0].k,
          exp:opts.map(x=>esc(x.nome)+': <span class="k k-'+x.c[0]+'">'+KIND[x.c[0]]+'</span> '+esc(cellTxt(x.c))).join('<br>'), nota:r.nota, row:r, set});
      });
    }
  }));
  if(qz.modes.includes("hed")){
    const tits = qz.set==="all"?null:(qz.set==="t1"?["t1"]:["t2","t3"]);
    allCrimes.filter(cr=>!tits||tits.includes(cr.tid)).forEach(cr=>cr.penas.forEach((p,pi)=>{
      const hd=p[4]||""; if(/controvert|depende|segue|só /i.test(hd)) return;
      const ans=/^Sim/.test(hd)?"S":(/^N(ão|ao)/.test(hd)?"N":null); if(!ans) return;
      bank.push({mode:"hed",key:"hed|"+cr.id+"|"+pi,src:{crime:cr.id},
        stem:'<b>'+esc(cr.nome)+'</b> ('+esc(cr.art)+'), forma “'+esc(p[0])+'” ('+esc(p[1])+'): é crime hediondo?',
        opts:[["S","Sim"],["N","Não"]], ans, exp:esc(hd)+'<br>Pena: '+esc(p[2]), nota:"", crime:cr});
    }));
  }
  return bank;
}
function qLoadWrong(){ try{return JSON.parse(store.get("qzWrong")||"[]")}catch(e){return []} }
function qSaveWrong(a){ store.set("qzWrong",JSON.stringify(a.slice(-300))) }
function startQuiz(onlyWrong){
  const bank=buildBank(); let pool=bank;
  if(onlyWrong){const w=new Set(qLoadWrong()); pool=bank.filter(q=>w.has(q.key))}
  // um item por linha do comparador sempre que possível, para variar
  const seen=new Set(), first=[], rest=[];
  shuffle(pool).forEach(q=>{const g=q.mode+(q.src.row!=null?q.src.set+q.src.row:q.src.crime); (seen.has(g)?rest:first).push(q); seen.add(g)});
  qz.list=[...first,...rest].slice(0,qz.n); qz.i=0; qz.pick=null; qz.hits=0; qz.wrong=[]; qz.done=false; qz.started=true;
  render(); window.scrollTo(0,0);
}

      if(qz.wrong.length){h+='<ul class="items">'+qz.wrong.map(q=>'<li><span class="ref">'+({nat:"Natureza",par:"Comparação",onde:"Onde",hed:"Hediondez"})[q.mode]+'</span><div class="txt">'+q.stem+'<div class="qz-exp">'+q.exp+'</div></div></li>').join("")+'</ul>'}

    }
    h+='<section class="sec"><header><h3>Montar treino</h3><span class="hint">'+bankN+' questões possíveis com esta escolha</span></header><div class="qz-setup">';
    h+='<div class="qz-row"><span class="qz-lbl">Tabela</span><div class="chips">'+[["all","Todas"],...CMPSETS.map(s=>[s.id,s.nome])].map(([k,l])=>'<button data-qset="'+k+'" aria-pressed="'+(qz.set===k)+'">'+esc(l)+'</button>').join("")+'</div></div>';
    h+='<div class="qz-row"><span class="qz-lbl">Tipos</span><div class="chips">'+QMODES.map(([k,l])=>'<button data-qmode="'+k+'" aria-pressed="'+qz.modes.includes(k)+'">'+l+'</button>').join("")+'</div></div>';
    h+='<div class="qz-row"><span class="qz-lbl">Quantidade</span><div class="chips">'+[10,20,40].map(n=>'<button data-qn="'+n+'" aria-pressed="'+(qz.n===n)+'">'+n+'</button>').join("")+'</div></div>';
    h+='<div class="qz-row qz-go"><button class="qz-btn" data-qstart="1"'+(bankN?'':' disabled')+'>Começar</button>'+(wrongN?'<button class="qz-btn ghost" data-qwrong="1">Refazer as que errei ('+wrongN+')</button>':'')+'</div>';
    h+='<p class="qz-help"><b>Natureza</b>: a circunstância qualifica, aumenta, agrava ou é elementar naquele crime. <b>Comparação</b>: a mesma circunstância em dois crimes. <b>Onde qualifica</b>: qual crime tem a forma qualificada. <b>Hediondez</b>: cada forma da tabela de penas.</p>';
    h+='</div></section>';
    $("#main").innerHTML=h; bindQuiz(); return;
  }
  const q=qz.list[qz.i]; const answered=qz.pick!==null;
  h+='<div class="qz-bar"><span>Questão '+(qz.i+1)+' de '+qz.list.length+'</span><span>'+qz.hits+' acerto'+(qz.hits===1?'':'s')+'</span></div>';
  h+='<div class="qz-prog"><i style="width:'+(100*(qz.i+(answered?1:0))/qz.list.length)+'%"></i></div>';
  h+='<section class="sec qz-card"><p class="qz-stem">'+q.stem+'</p><div class="qz-opts">';
  q.opts.forEach(([k,l],ix)=>{
    let cls=""; if(answered){ if(k===q.ans) cls=" ok"; else if(k===qz.pick) cls=" bad"; }
    h+='<button class="qz-opt'+cls+'" data-qopt="'+esc(k)+'"'+(answered?' disabled':'')+'><span class="qz-l">'+"ABCD"[ix]+'</span>'+esc(l)+'</button>';
  });
  h+='</div>';
  if(answered){
    const right=qz.pick===q.ans;
    h+='<div class="qz-fb '+(right?'ok':'bad')+'"><b>'+(right?'Certo.':'Não é essa.')+'</b><div class="qz-exp">'+q.exp+'</div>'+(q.nota?'<p class="qz-nota">'+esc(q.nota)+'</p>':'')+'</div>';
    h+='<div class="qz-row qz-go"><button class="qz-btn" data-qnext="1">'+(qz.i+1<qz.list.length?'Próxima':'Ver resultado')+'</button>'+
       (q.mode==="hed"?'<button class="qz-btn ghost" data-qgo="'+q.src.crime+'">Abrir a ficha</button>':'<button class="qz-btn ghost" data-qcmp="'+q.src.set+'">Ver no Comparador</button>')+
       '<button class="qz-btn ghost" data-qstop="1">Encerrar</button></div>';
  }
  h+='</section>';
  $("#main").innerHTML=h; bindQuiz();
}
function bindQuiz(){
  const M=$("#main");
  M.querySelectorAll("[data-qset]").forEach(b=>b.onclick=()=>{qz.set=b.dataset.qset; qz.done=false; qz.started=false; render()});
  M.querySelectorAll("[data-qmode]").forEach(b=>b.onclick=()=>{const k=b.dataset.qmode; qz.modes=qz.modes.includes(k)?qz.modes.filter(x=>x!==k):[...qz.modes,k]; if(!qz.modes.length) qz.modes=[k]; qz.done=false; qz.started=false; render()});
  M.querySelectorAll("[data-qn]").forEach(b=>b.onclick=()=>{qz.n=+b.dataset.qn; render()});
  M.querySelectorAll("[data-qstart]").forEach(b=>b.onclick=()=>startQuiz(false));
  M.querySelectorAll("[data-qwrong]").forEach(b=>b.onclick=()=>startQuiz(true));
  M.querySelectorAll("[data-qopt]").forEach(b=>b.onclick=()=>{
    const q=qz.list[qz.i]; qz.pick=b.dataset.qopt; let w=qLoadWrong();
    if(qz.pick===q.ans){qz.hits++; w=w.filter(k=>k!==q.key)} else {qz.wrong.push(q); if(!w.includes(q.key)) w.push(q.key)}
    qSaveWrong(w); render();
  });
  M.querySelectorAll("[data-qnext]").forEach(b=>b.onclick=()=>{ if(qz.i+1<qz.list.length){qz.i++; qz.pick=null} else qz.done=true; render(); window.scrollTo(0,0)});
  M.querySelectorAll("[data-qstop]").forEach(b=>b.onclick=()=>{qz.list=qz.list.slice(0,qz.i+1); qz.done=true; render()});
  M.querySelectorAll("[data-qcmp]").forEach(b=>b.onclick=()=>{state.cmp=b.dataset.qcmp; state.view="cmp"; render(); window.scrollTo(0,0)});
  M.querySelectorAll("[data-qgo]").forEach(b=>b.onclick=()=>{state.crime=b.dataset.qgo; state.view="fichas"; render(); window.scrollTo(0,0)});
}

function render(){
  renderFilters(); renderTree();
  $("#vFichas").setAttribute("aria-pressed",state.view==="fichas");
  $("#vCmp").setAttribute("aria-pressed",state.view==="cmp");
  $("#vProg").setAttribute("aria-pressed",state.view==="prog");
  $("#vQuiz").setAttribute("aria-pressed",state.view==="quiz");
  $("#vTemas").setAttribute("aria-pressed",state.view==="temas");
  $("#filters").style.display = ((state.view==="quiz"||state.view==="temas") && !(state.q.trim().length>=2)) ? "none" : "";
  if(state.q.trim().length>=2) renderSearch();
  else if(state.view==="cmp") renderCmp(); else if(state.view==="quiz") renderQuiz(); else if(state.view==="temas") renderTemas(); else if(state.view==="prog") renderProg(); else renderFicha();
}

/* ===================== EVENTOS ===================== */
function closeMenu(){$("#tree").classList.remove("open");$("#scrim").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false")}
$("#filters").addEventListener("click",e=>{const b=e.target.closest("[data-f]"); if(!b)return; state.filter=b.dataset.f; store.set("filter",state.filter); render()});
$("#tree").addEventListener("click",e=>{
  const v=e.target.closest("[data-v]"); if(v){e.preventDefault(); state.view="prog"; state.q=""; $("#q").value=""; closeMenu(); render(); window.scrollTo(0,0); return}
  const a=e.target.closest("[data-c]"); if(!a)return; e.preventDefault();
  state.crime=a.dataset.c; state.view="fichas"; {const cc=allCrimes.find(c=>c.id===state.crime); if(cc){state.open.add(cc.tid);state.closed.delete(cc.tid)}} state.q=""; $("#q").value=""; store.set("crime",state.crime);
  try{history.replaceState(null,"","#"+state.crime)}catch(_){}
  closeMenu(); render(); window.scrollTo(0,0)});
$("#vFichas").addEventListener("click",()=>{state.view="fichas";state.q="";$("#q").value="";render()});
$("#vCmp").addEventListener("click",()=>{state.view="cmp";state.q="";$("#q").value="";render()});
$("#vTemas").addEventListener("click",()=>{state.view="temas";state.q="";$("#q").value="";render()});
$("#vQuiz").addEventListener("click",()=>{state.view="quiz";state.q="";$("#q").value="";render()});
$("#vProg").addEventListener("click",()=>{state.view="prog";state.q="";$("#q").value="";render()});
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#menuBtn").addEventListener("click",()=>{const o=$("#tree").classList.toggle("open");$("#scrim").classList.toggle("open",o);$("#menuBtn").setAttribute("aria-expanded",o)});
$("#scrim").addEventListener("click",closeMenu);
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1); if(allCrimes.find(c=>c.id===id)){state.crime=id;state.view="fichas";render()} else if(id==="comparador"){state.view="cmp";render()} else if(id==="progresso"){state.view="prog";render()} else if(id==="treino"){state.view="quiz";render()} else if(id==="temas"){state.view="temas";render()}});
const sf=store.get("filter"); if(sf && FILTERS.some(f=>f[0]===sf)) state.filter=sf;
if(location.hash==="#comparador") state.view="cmp";
if(location.hash==="#progresso") state.view="prog";
if(location.hash==="#treino") state.view="quiz";
if(location.hash==="#temas") state.view="temas";
render();
</script>
